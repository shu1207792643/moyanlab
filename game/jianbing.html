<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>赛博煎饼小摊</title>
<style>
  :root{
    --bg:#121110; --cardBg:#1E1C1A; --panel:#282420; --panelL:#38322B;
    --line:#423A30; --text:#F5E8D0; --textDim:#A3947D;
    --gold:#F3CE85; --warm:#FF984E; --green:#38B468; --red:#E74C3C;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html{ height:100%; }
  body{
    min-height:100%;
    color:var(--text); font-family:"Songti SC","STSong","SimSun",serif;
    display:flex; justify-content:center; align-items:flex-start; user-select:none; -webkit-user-select:none;
    min-height:100vh; min-height:100dvh;
    background-color:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px),
      radial-gradient(90vw 90vh at 50% 16%, rgba(255,152,78,.10), transparent 60%),
      radial-gradient(115vw 105vh at 84% 90%, rgba(124,92,255,.10), transparent 62%);
    background-size:46px 46px, 46px 46px, auto, auto;
    background-attachment:fixed;
  }

  /* 核心修复：顶部给足 88px 绝对避让返回键与胶囊 */
  .app{
    width:100%; max-width:414px; height:100%; min-height:100vh;
    background:radial-gradient(500px 300px at 50% 0%, #2A251F 0%, var(--cardBg) 70%, #161413 100%);
    padding: 88px 12px 14px 12px;
    padding-top: max(88px, calc(env(safe-area-inset-top) + 48px));
    display:flex; flex-direction:column; justify-content:space-between; position:relative;
    overflow:hidden;
  }

  /* 返回主站浮动按钮：左安全区、磨砂玻璃、暗金；置于开屏层(z:100)之下，游戏内容之上 */
  .back-home{
    position:absolute; z-index:30;
    top:max(10px, env(safe-area-inset-top));
    left:calc(env(safe-area-inset-left) + 10px);
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px;
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:12px; letter-spacing:1px; color:#F3CE85; text-decoration:none;
    background:rgba(18,16,14,.5);
    border:1px solid rgba(243,206,133,.5);
    -webkit-backdrop-filter:blur(10px) saturate(150%); backdrop-filter:blur(10px) saturate(150%);
    box-shadow:0 4px 18px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
    transition:background .25s ease, border-color .25s ease, transform .25s ease, color .25s ease;
  }
  .back-home:hover{ background:rgba(42,36,30,.72); border-color:#F3CE85; color:#FFE9B0; transform:translateY(-1px); }
  .back-home:active{ transform:scale(.95); }

  /* ==== 桌面端（>500px）：赛博街机掌机 / 终端视窗外框 ==== */
  @media (min-width:501px){
    body{ align-items:center; }
    .app{
      width:414px; min-width:414px; max-width:414px;
      height:auto; min-height:0;
      margin:52px auto;
      border:1px solid rgba(255,152,78,.38);
      border-radius:26px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.8),
        0 0 30px rgba(255,152,78,0.15),
        inset 0 0 0 1px rgba(255,255,255,.045),
        inset 0 0 44px rgba(0,0,0,.32);
    }
  }

  /* ==== 移动端（≤500px）：无缝撑满手机屏，取消边框与阴影 ==== */
  @media (max-width:500px){
    body{ align-items:flex-start; background:var(--bg); }
    .app{
      width:100%; height:100%; min-width:0; max-width:100%;
      min-height:100vh; min-height:100dvh;
      margin:0; border:none; border-radius:0; box-shadow:none;
      background:radial-gradient(500px 300px at 50% 0%, #2A251F 0%, var(--cardBg) 70%, #161413 100%);
    }
    .back-home{ top:calc(env(safe-area-inset-top) + 8px); }
  }

  .splash-screen{
    position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, #2B231B 0%, #161311 75%, #0A0908 100%);
    z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:90px 30px 30px; text-align:center; transition:opacity 0.5s ease;
  }
  .splash-screen.fade-out{ opacity:0; pointer-events:none; }
  .splash-lantern{ font-size:42px; margin-bottom:12px; filter:drop-shadow(0 0 16px rgba(255,152,78,0.6)); }
  .splash-title{ font-size:26px; letter-spacing:5px; color:var(--gold); font-weight:700; }
  .splash-sub{ font-size:11px; color:var(--textDim); letter-spacing:4px; margin-top:4px; }
  .splash-quote{ font-size:12px; color:#D8C4A6; margin:24px 0; line-height:1.7; font-style:italic; border-top:1px dashed #4A3E31; border-bottom:1px dashed #4A3E31; padding:10px 0; width:100%; }
  .splash-progress-wrap{ width:80%; height:6px; background:#29221B; border-radius:3px; overflow:hidden; margin-bottom:10px; }
  .splash-progress-bar{ width:0%; height:100%; background:linear-gradient(90deg, #BA9B5E, var(--warm)); border-radius:3px; transition:width 0.1s linear; }
  .splash-status{ font-size:11px; color:var(--textDim); }
  .btn-start-game{
    margin-top:20px; border:1px solid #BA9B5E; background:linear-gradient(180deg, var(--warm), #D36C22);
    color:#1A0F05; font-weight:700; font-size:15px; letter-spacing:2px; padding:12px 28px;
    border-radius:999px; cursor:pointer; display:none;
  }
  
  header{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 10px;
  }
  h1{ font-size:15px; letter-spacing:1px; color:var(--gold); }
  .header-actions{ display:flex; align-items:center; gap:5px; }
  .header-btn{
    background:linear-gradient(180deg, #4A3E30, #32281D); border:1px solid #BA9B5E;
    color:var(--gold); font-size:11px; padding:4px 6px; border-radius:7px; cursor:pointer;
  }
  .stat-group{ display:flex; gap:6px; }
  .stat-box{ text-align:right; }
  .stat-box .k{ font-size:8px; color:var(--textDim); }
  .stat-box .v{ font-size:11px; font-weight:700; color:var(--gold); }

  .order-banner{
    background:linear-gradient(90deg, #2D2720, #221E19);
    border:1px solid #4D4030; border-radius:12px; padding:7px 10px;
    display:flex; align-items:center; gap:8px; margin-top:6px;
  }
  .order-avatar{ font-size:24px; }
  .order-content{ flex:1; }
  .order-who{ font-size:10px; color:var(--textDim); }
  .order-say{ font-size:12px; line-height:1.3; color:#FFF; }
  .order-say b{ color:var(--warm); }
  .order-tip{ font-size:11px; color:var(--gold); font-weight:700; }

  .griddle-wrap{
    width:100%; height:320px; background:#12100E; border:1px solid var(--line);
    border-radius:16px; position:relative; overflow:hidden; margin-top:6px;
    display:flex; align-items:center; justify-content:center;
  }
  #gameCanvas{ width:360px; height:320px; display:block; touch-action:none; }
  .hintbar{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    background:rgba(18,15,13,.92); border:1px solid #4A3E31; padding:4px 14px;
    border-radius:999px; font-size:11px; color:var(--text); letter-spacing:1px;
    pointer-events:none; white-space:nowrap; z-index:5;
  }
  .hintbar b{ color:var(--warm); }

  .tray-wrap{ margin-top:6px; }
  .tray-title{ 
    font-size:10px; color:var(--textDim); margin-bottom:4px; 
    display:flex; justify-content:space-between; align-items:center; 
    white-space:nowrap; overflow:hidden;
  }
  .tray-title #trayTips{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tray-title span:last-child{ flex-shrink:0; margin-left:6px; white-space:nowrap; }
  .tray-scroll{
    display:flex; gap:6px; overflow-x:auto; padding:2px 2px 4px 2px;
    scrollbar-width:none; cursor:grab;
  }
  .tray-scroll::-webkit-scrollbar{ display:none; }
  
  .ing-card{
    flex:0 0 66px; height:70px; background:linear-gradient(180deg, var(--panelL), var(--panel));
    border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; cursor:pointer; position:relative;
  }
  .ing-card.locked{ opacity:0.35; filter:grayscale(1); }
  .ing-icon{ font-size:22px; line-height:1; }
  .ing-name{ font-size:11px; color:var(--text); }
  .ing-price{ font-size:9px; color:var(--warm); }
  .ing-badge{ position:absolute; top:2px; right:4px; font-size:9px; color:var(--red); font-weight:700; }

  .action-bar{ display:flex; gap:8px; margin-top:6px; }
  .action-btn{
    flex:1; padding:10px; border-radius:11px; border:none; font-family:inherit;
    font-size:13px; letter-spacing:2px; font-weight:700; cursor:pointer;
  }
  .btn-flip{ background:linear-gradient(180deg, #534537, #372E25); border:1px solid #6E5C49; color:var(--text); }
  .btn-serve{ background:linear-gradient(180deg, var(--warm), #D36C22); border:1px solid #B05313; color:#1A0F05; }
  .action-btn:disabled{ opacity:0.3; cursor:not-allowed; }

  .modal-mask{
    position:fixed; inset:0; background:rgba(10,8,7,.82);
    display:flex; align-items:center; justify-content:center; z-index:50;
    padding-bottom:5vh;
  }
  .ticket{
    width:320px; max-height:92vh; overflow-y:auto; scrollbar-width:none;
    background:repeating-linear-gradient(0deg,#F5E8C7 0,#F5E8C7 2px,#EBDABA 2px,#EBDABA 4px);
    border:2px solid #BA9B5E; border-radius:6px; padding:15px 18px; color:#382C1E; box-shadow:0 10px 32px rgba(0,0,0,.6);
  }
  .ticket h3{ text-align:center; letter-spacing:3px; font-size:15px; font-weight:700; }
  .ticket .subline{ text-align:center; font-size:10px; letter-spacing:2px; color:#6B593E; margin:2px 0 8px; border-bottom:1px dashed #BA9B5E; padding-bottom:6px; }
  .ticket .row{ display:flex; justify-content:space-between; font-size:12px; line-height:1.8; }
  .ticket .row .v{ font-weight:700; }
  .ticket .big{ font-size:20px; color:#B3371D; font-weight:700; }
  .quote-box{ margin:8px 0; background:rgba(0,0,0,.05); border-left:3px solid #BA9B5E; padding:6px 8px; font-size:11px; line-height:1.5; color:#473620; }
  
  .shop-panel{ width:330px; max-height:86vh; background:#1C1916; border:2px solid #BA9B5E; border-radius:16px; padding:16px; overflow-y:auto; scrollbar-width:none; color:var(--text); }
  .shop-item{ display:flex; justify-content:space-between; align-items:center; background:#2A241C; border:1px solid #483E31; border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .shop-info .sn{ font-weight:700; font-size:12px; color:var(--gold); }
  .shop-info .sd{ font-size:10px; color:var(--textDim); }
  .shop-buy{ border:1px solid #BA9B5E; background:linear-gradient(180deg, var(--warm), #D36C22); color:#1A0F05; font-weight:700; padding:6px 12px; border-radius:6px; font-size:11px; cursor:pointer; }
  .shop-buy:disabled{ opacity:0.4; cursor:not-allowed; background:#55483B; color:#A8987E; border-color:#55483B; }

  .book-panel{ width:340px; max-height:86vh; background:#1C1916; border:2px solid #BA9B5E; border-radius:16px; padding:16px; overflow-y:auto; scrollbar-width:none; color:var(--text); }
  .book-progress-bar{ width:100%; height:6px; background:#2D261E; border-radius:3px; overflow:hidden; margin-bottom:14px; }
  .book-progress-fill{ height:100%; background:linear-gradient(90deg, #BA9B5E, var(--gold)); width:0%; transition:width 0.3s; }
  .book-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .medal-slot{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#25201A; border:1.5px solid #3E3427; border-radius:12px; padding:10px 4px; cursor:pointer;
  }
  .medal-circle{
    width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:4px;
  }
  .medal-slot.locked .medal-circle{ background:#2A251F; border:2px solid #483E31; color:#6B5F4E; font-size:18px; filter:grayscale(1); opacity:0.65; }
  .medal-slot.locked .medal-name{ font-size:9px; color:var(--textDim); }
  .medal-slot.unlocked{ border-color:var(--gold); background:linear-gradient(180deg, #382D1F, #231C15); }
  .medal-slot.unlocked .medal-circle{ background:radial-gradient(circle at 35% 35%, #FFF0C2, #E5BA5A 60%, #9C7221 100%); border:2px solid #FFE082; }
  .medal-slot.unlocked .medal-name{ font-size:10px; font-weight:700; color:var(--gold); }

  .detail-card{ width:280px; background:#241F19; border:2px solid var(--gold); border-radius:14px; padding:18px; text-align:center; color:var(--text); }
  .detail-icon{ width:64px; height:64px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:32px; }
  .detail-title{ font-size:15px; font-weight:700; color:var(--gold); margin-bottom:6px; }
  .detail-desc{ font-size:11px; color:#D4C5B0; line-height:1.5; margin-bottom:12px; background:rgba(0,0,0,.25); padding:8px; border-radius:8px; }
  .detail-reward{ font-size:11px; color:var(--warm); font-weight:700; margin-bottom:12px; }

  .aha-card{ width:290px; background:radial-gradient(circle at 50% 0%, #FFECC0, #EAD4A6); border:3px solid #D4AF37; border-radius:14px; padding:20px; text-align:center; color:#3A2710; }
  .aha-badge{ font-size:44px; margin-bottom:6px; }
  .aha-title{ font-size:17px; font-weight:700; color:#8C2508; }
  .aha-desc{ font-size:11px; margin:8px 0 12px; line-height:1.5; color:#5A4020; }
  .aha-bonus{ font-size:15px; font-weight:700; color:#B3371D; margin-bottom:12px; }

  .toast{ position:fixed; top:12%; left:50%; transform:translate(-50%,0); background:rgba(245,232,200,.96); color:#352718; padding:8px 16px; border-radius:12px; font-size:13px; font-weight:700; opacity:0; transition:opacity .2s; pointer-events:none; z-index:90; }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="app">

  <a class="back-home" href="../games.html" aria-label="返回墨焱独立游戏专区">⬅ 返回游戏专区</a>

  <div class="splash-screen" id="splashScreen">
    <div class="splash-lantern">🏮</div>
    <div class="splash-title">赛博煎饼小摊</div>
    <div class="splash-sub">STREET JIANBING MASTER</div>
    <div class="splash-quote">“夜幕降临，华灯初上。<br>在街角的烟火气里，抚慰每一个深夜灵魂。”</div>
    
    <div class="splash-progress-wrap">
      <div class="splash-progress-bar" id="splashBar"></div>
    </div>
    <div class="splash-status" id="splashStatus">正在生火热铛…</div>
    
    <button class="btn-start-game" id="btnStartGame">🏮 揭开招牌 · 开始出摊</button>
  </div>

  <header>
    <div>
      <h1 id="stallTitle">赛博煎饼小摊</h1>
      <div style="font-size:8px; color:var(--textDim)">JIANBING STALL</div>
    </div>
    <div class="header-actions">
      <!-- 听劝功能：随时进货 -->
      <button class="header-btn" id="btnOpenShop">🛒 进货</button>
      <button class="header-btn" id="btnOpenBook">🎖️ (<span id="bookCount">0</span>/16)</button>
      <!-- 听劝功能：治愈音乐开关 -->
      <button class="header-btn" id="btnSound" style="padding:4px 6px;">🎵</button>
      <div class="stat-group">
        <div class="stat-box"><div class="k">天数</div><div class="v">第 <span id="dayNum">1</span> 天</div></div>
        <div class="stat-box"><div class="k">金币</div><div class="v">￥<span id="coinsShow">0</span></div></div>
        <div class="stat-box"><div class="k">单数</div><div class="v"><span id="ordersShow">1</span>/<span id="maxOrdersShow">5</span></div></div>
      </div>
    </div>
  </header>

  <div class="order-banner">
    <div class="order-avatar" id="cAvatar">🧑‍🎓</div>
    <div class="order-content">
      <div class="order-who" id="cName">赶早八大学生</div>
      <div class="order-say" id="cSay">老板，只要<b>双蛋+热狗</b>，千万别放葱！</div>
    </div>
    <div class="order-tip" id="cBonus">+￥8 小费</div>
  </div>

  <div class="griddle-wrap">
    <canvas id="gameCanvas" width="360" height="320"></canvas>
    <div class="hintbar" id="hint">按住木刮板画圈摊开面糊</div>
  </div>

  <div class="tray-wrap">
    <div class="tray-title">
      <span id="trayTips">🥩 正面生料：加鸡蛋/葱花/芝麻</span>
      <span style="color:var(--warm)">按要求加料拿小费 ✨</span>
    </div>
    <div class="tray-scroll" id="trayScroll"></div>
  </div>

  <div class="action-bar">
    <button class="action-btn btn-flip" id="btnFlip">翻转脆底 ↺</button>
    <button class="action-btn btn-serve" id="btnServe">折叠装袋 · 出餐！</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 外部引入独立 JS -->
<script src="./main.js"></script>
</body>
</html>
