  var host = location.hostname || '';
  window.__CG_ON_PLATFORM__ = /(^|\.)crazygames\.com$/i.test(host);
  window.__cgSdkLoaded__ = false;
  if (!window.__CG_ON_PLATFORM__) { window.__cgSdkLoaded__ = true; return; }
  var script = document.createElement('script');
  script.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
  script.async = true;
  script.onload = function () { window.__cgSdkLoaded__ = true; if (window.__cgSdkOnLoaded) window.__cgSdkOnLoaded(); };
  script.onerror = function () { window.__cgSdkLoaded__ = true; };
  document.head.appendChild(script);
})();
</script>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let viewW = 1280;
let viewH = 720;
let dpr = Math.min(window.devicePixelRatio || 1, 2);
const moyanLogoImg = new Image();
moyanLogoImg.src = "logo.png";
/* Declared up-front so resize()/input handlers never hit TDZ before construction. */
let engine = null;
const isTouchDevice = () => ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const TAU = Math.PI * 2;
const rand = (min, max) => Math.random() * (max - min) + min;
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const fmtTime = seconds => {
  const total = Math.max(0, Math.floor(seconds));
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
};
const rgba = (hex, alpha) => {
  const value = hex.replace('#', '');
  const n = parseInt(value.length === 3 ? value.split('').map(x => x + x).join('') : value, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
};

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
const META_KEY = 'cyber_save_v1';
const TALENTS = [
  { key: 'armor', name: 'NANO ARMOR', desc: '+20 MAX HP PER LV', color: '#ff5d96' },
  { key: 'engine', name: 'OVERCLOCK ENGINE', desc: '+6% MOVE SPEED', color: '#6bf5ff' },
  { key: 'magnet', name: 'GRAVITY GRIP', desc: '+15% MAGNET RANGE', color: '#c7ff62' },
  { key: 'capacitor', name: 'OVERLOAD CAPACITOR', desc: '+4% CRIT RATE', color: '#ffe06d' },
  { key: 'wingman', name: 'TACTICAL WINGMAN', desc: 'DEPLOY 2 ORBIT DRONES', color: '#b978ff' }
];

function defaultMeta() {
  return { chips: 0, talents: { armor: 0, engine: 0, magnet: 0, capacitor: 0, wingman: 0 }, bestScore: { time: 0, kills: 0 }, daily: '', muted: false };
}
function readMeta() {
  const base = defaultMeta();
  try {
    const saved = JSON.parse(localStorage.getItem(META_KEY) || 'null');
    if (!saved || typeof saved !== 'object') return base;
    base.chips = Math.max(0, Number(saved.chips) || 0);
    const bs = saved.bestScore && typeof saved.bestScore === 'object' ? saved.bestScore : {};
    base.bestScore.time = Math.max(0, Number(bs.time) || 0);
    base.bestScore.kills = Math.max(0, Number(bs.kills) || 0);
    /* Field-by-field coercion: a corrupted talent ("x") used to produce NaN HP
       the moment the lab was opened. Levels are clamped to the real 0..5 range. */
    const tal = saved.talents && typeof saved.talents === 'object' ? saved.talents : {};
    for (const key of Object.keys(base.talents)) {
      const v = Number(tal[key]);
      base.talents[key] = Number.isFinite(v) ? clamp(Math.floor(v), 0, 5) : 0;
    }
    /* Daily supply is keyed by local calendar date so it actually resets. */
    base.daily = typeof saved.daily === 'string' ? saved.daily : (saved.daily ? '' : '');
    base.muted = !!saved.muted;
  } catch (e) {}
  return base;
}
function writeMeta(meta) {
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {}
}
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function dailyClaimed(meta) { return meta.daily === todayKey(); }

class CrazyGamesAdapter {
  constructor(audio) {
    this.audio = audio;
    this.busy = false;
    this.lastMidgame = 0;
    this.gameplayActive = false;
    // 由页面顶部的环境探测结果决定：只有 CrazyGames 官方域名才接线上广告，
    // 本地 file:// 与自托管站点一律走本地模拟。
    this.onPlatform = window.__CG_ON_PLATFORM__ === true;
    this.init();
  }
  async init() {
    if (!this.onPlatform) return;
    /* Wait for the async SDK script (onload sets __cgSdkLoaded__) before init —
       racing past it left SDK.init() permanently skipped on the platform. */
    if (!window.__cgSdkLoaded__) {
      await new Promise(resolve => {
        const prev = window.__cgSdkOnLoaded;
        window.__cgSdkOnLoaded = () => { if (prev) prev(); resolve(); };
      });
    }
    try {
      if (window.CrazyGames && window.CrazyGames.SDK) {
        await window.CrazyGames.SDK.init();
      }
    } catch (e) {}
  }
  get sdk() { return this.onPlatform && window.CrazyGames && window.CrazyGames.SDK ? window.CrazyGames.SDK : null; }
  gameplayStart() {
    if (this.gameplayActive) return;
    this.gameplayActive = true;
    try { this.sdk?.game?.gameplayStart?.(); } catch (e) {}
  }
  gameplayStop() {
    if (!this.gameplayActive) return;
    this.gameplayActive = false;
    try { this.sdk?.game?.gameplayStop?.(); } catch (e) {}
  }
  happytime() { try { this.sdk?.game?.happytime?.(); } catch (e) {} }
  request(type, onReward, onFail) {
    if (this.busy) { onFail?.(); return false; }
    this.busy = true;
    const finish = () => {
      this.busy = false;
      this.audio?.unmute();
      this.gameplayStop();
      onReward?.();
    };
    const fail = () => {
      this.busy = false;
      this.audio?.unmute();
      this.gameplayStop();
      onFail?.();
    };
    const start = () => {
      this.audio?.mute();
      this.gameplayStop();
    };

    const sdk = this.sdk;
    if (!sdk?.ad?.requestAd) {
      /* On the CrazyGames domain the SDK must never "succeed" without a real
         ad — that is a policy violation. Only off-platform hosts simulate. */
      if (this.onPlatform) { this.busy = false; onFail?.(); return false; }
      start();
      setTimeout(finish, 1000);
      return true;
    }
    try {
      sdk.ad.requestAd(type, { adStarted: start, adFinished: finish, adError: fail });
      /* Guard: an SDK that swallows the request would leave busy stuck forever. */
      setTimeout(() => { if (this.busy) fail(); }, 180000);
    } catch (e) { fail(); }
    return true;
  }
  rewarded(onReward, onFail) { return this.request('rewarded', onReward, onFail); }
  midgame(onDone) {
    if (performance.now() - this.lastMidgame < 180000) { onDone?.(); return false; }
    this.lastMidgame = performance.now();
    return this.request('midgame', onDone, onDone);
  }
}

function resize() {
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width = `${viewW}px`;
  canvas.style.height = `${viewH}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (engine) engine._bgGrad = null;
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

class AudioController {
  constructor() {
    this.context = null;
    this.master = null;
    this.enabled = true;
    this.muted = false;
    this.userMuted = false;
    this._noise = null;
    this._activeVoices = 0;
  }
  setUserMuted(m) {
    this.userMuted = !!m;
    this.applyGain();
  }
  mute() { this.muted = true; this.applyGain(); }
  unmute() { this.muted = false; this.applyGain(); }
  applyGain() {
    if (!this.master || !this.context) return;
    const target = (this.muted || this.userMuted) ? 0 : .16;
    try {
      const t = this.context.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setValueAtTime(this.master.gain.value, t);
      this.master.gain.setTargetAtTime(target, t, .03);
    } catch (e) { this.master.gain.value = target; }
  }
  boot() {
    if (this.context) {
      if (this.context.state === 'suspended') this.context.resume().catch(() => {});
      this.applyGain();
      return;
    }
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    this.context = new AudioContextClass();
    this.master = this.context.createGain();
    this.master.gain.value = (this.muted || this.userMuted) ? 0 : .16;
    this.master.connect(this.context.destination);
  }
  resume() {
    if (this.context && this.context.state === 'suspended') this.context.resume().catch(() => {});
  }
  suspend() {
    if (this.context && this.context.state === 'running') { try { this.context.suspend(); } catch (e) {} }
  }
  tone(frequency, duration, type = 'sine', volume = .08, slide = 1) {
    if (!this.enabled || !this.context || !this.master || this.muted || this.userMuted) return;
    /* Cap concurrent one-shot voices — blade hits at 120Hz used to storm the
       audio graph and click on weaker devices. */
    if (this._activeVoices > 8) return;
    const now = this.context.currentTime;
    const osc = this.context.createOscillator();
    const gain = this.context.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, frequency), now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, frequency * slide), now + duration);
    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + .008);
    gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
    osc.connect(gain).connect(this.master);
    this._activeVoices++;
    osc.onended = () => { this._activeVoices = Math.max(0, this._activeVoices - 1); };
    osc.start(now);
    osc.stop(now + duration + .02);
  }
  shot() { this.tone(350, .055, 'square', .045, .42); }
  hyperShot() { this.tone(550, .09, 'sawtooth', .06, .2); }
  hit() { this.tone(180, .08, 'triangle', .045, 1.7); }
  dash() { this.tone(180, .18, 'sawtooth', .075, 3.2); }
  blade() { this.tone(640, .045, 'sine', .028, .74); }
  grenade() { this.tone(90, .18, 'sawtooth', .06, .45); }
  explosion(critical = false) {
    this.tone(critical ? 110 : 80, critical ? .28 : .18, 'sawtooth', critical ? .13 : .075, .18);
    this.noise(critical ? .25 : .14, critical ? .12 : .065);
  }
  ensureNoise() {
    if (this._noise) return this._noise;
    const length = Math.floor(this.context.sampleRate * .5);
    const buffer = this.context.createBuffer(1, length, this.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    this._noise = buffer;
    return buffer;
  }
  noise(duration, volume) {
    if (!this.enabled || !this.context || !this.master || this.muted || this.userMuted) return;
    const source = this.context.createBufferSource();
    source.buffer = this.ensureNoise();
    source.playbackRate.value = rand(.85, 1.2);
    const filter = this.context.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1600;
    const gain = this.context.createGain();
    const now = this.context.currentTime;
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
    source.connect(filter).connect(gain).connect(this.master);
    source.start(now);
    source.stop(now + duration + .02);
  }
  levelUp() {
    [0, 4, 7, 12].forEach((step, index) => {
      setTimeout(() => this.tone(330 * Math.pow(2, step / 12), .28, 'sine', .07, 1.04), index * 75);
    });
  }
  click() { this.tone(480, .06, 'square', .04, 1.5); }
  warning() { this.tone(72, .18, 'sawtooth', .11, .62); setTimeout(() => this.tone(92, .2, 'square', .09, .5), 150); }
  boss() { this.noise(.34, .11); this.tone(42, .65, 'sawtooth', .11, 2.4); }
  evolution() { [0, 7, 12, 19, 24].forEach((step, index) => setTimeout(() => this.tone(220 * Math.pow(2, step / 12), .34, 'triangle', .09, 1.08), index * 65)); }
}

class ParticleSystem {
  constructor() {
    this.items = [];
    this.shockwaves = [];
    this.maxItems = 500;
  }
  emit(x, y, color, count = 8, speed = 100, size = 2.5, life = .7) {
    for (let i = 0; i < count; i++) {
      if (this.items.length >= this.maxItems) this.items.shift();
      const angle = rand(0, TAU);
      const power = speed * rand(.35, 1);
      this.items.push({ x, y, vx: Math.cos(angle) * power, vy: Math.sin(angle) * power, size: rand(size * .45, size), color, life: rand(life * .55, life), maxLife: life, drag: rand(.91, .97), gravity: rand(-8, 34) });
    }
  }
  sparks(x, y, color, count = 5) { this.emit(x, y, color, count, 180, 2, .42); }
  burst(x, y, colors, count = 10, power = 150) {
    for (let i = 0; i < count; i++) this.emit(x, y, colors[i % colors.length], 1, power, rand(2, 5), rand(.45, .9));
  }
  shock(x, y, color, radius = 30, maxRadius = 180, life = .38, damage = 0) {
    this.shockwaves.push({ x, y, color, radius, maxRadius, life, maxLife: life, damage, hit: new Set() });
  }
  update(dt) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const p = this.items[i];
      p.life -= dt;
      if (p.life <= 0) { this.items[i] = this.items[this.items.length - 1]; this.items.pop(); continue; }
      p.vx *= Math.pow(p.drag, dt * 60);
      p.vy = p.vy * Math.pow(p.drag, dt * 60) + p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = this.shockwaves.length - 1; i >= 0; i--) {
      const s = this.shockwaves[i];
      s.life -= dt;
      s.radius = lerp(s.radius, s.maxRadius, 1 - Math.pow(.001, dt / s.maxLife));
      if (s.life <= 0) { this.shockwaves[i] = this.shockwaves[this.shockwaves.length - 1]; this.shockwaves.pop(); }
    }
  }
  draw() {
    /* No per-particle shadowBlur — Canvas's most expensive state. A cheap
       two-pass disc (core + soft halo) reads as a glow for a fraction of the
       cost, which is what keeps late-wave frames from collapsing. */
    for (const p of this.items) {
      const alpha = clamp(p.life / p.maxLife, 0, 1);
      const r = p.size * (.5 + alpha * .5);
      ctx.globalAlpha = alpha * .28;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 2.2, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const s of this.shockwaves) {
      const alpha = clamp(s.life / s.maxLife, 0, 1);
      ctx.globalAlpha = alpha * .82;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 3 + alpha * 5;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = alpha * .18;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

const MAX_FLOATING = 40;
function pushFloating(list, item) {
  if (list.length >= MAX_FLOATING) list.shift();
  list.push(item);
}

class FloatingText {
  constructor(x, y, text, color, size = 14, emphasis = false) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.size = size;
    this.life = 1;
    this.maxLife = 1;
    this.emphasis = emphasis;
    this.vy = -34;
  }
  update(dt) { this.life -= dt; this.y += this.vy * dt; this.vy *= .98; }
  draw() {
    const alpha = clamp(this.life / this.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.font = `${this.emphasis ? 800 : 700} ${this.size}px "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = this.color;
    /* Emphasized crits keep a modest glow; normal hits draw flat — shadowBlur
       on every damage number was a major late-fight cost. */
    if (this.emphasis) {
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 12;
    }
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

class Gem {
  constructor(x, y, value = 1) {
    this.x = x;
    this.y = y;
    this.vx = rand(-20, 20);
    this.vy = rand(-20, 20);
    this.value = value;
    this.r = value > 3 ? 7 : 5;
    this.spin = rand(0, TAU);
    this.age = 0;
  }
  update(dt, player) {
    this.age += dt;
    this.spin += dt * 4;
    this.vx *= Math.pow(.88, dt * 60);
    this.vy *= Math.pow(.88, dt * 60);
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const d = Math.hypot(dx, dy);
    /* TTL: gems left behind used to pile up forever and degraded long runs.
       After 22s they auto-collect from anywhere (delayed credit, no loss). */
    if (this.age > 22) return true;
    if (d < player.magnet) {
      const power = d < 40 ? 650 : 260 + (1 - d / player.magnet) * 450;
      this.vx += dx / Math.max(d, 1) * power * dt;
      this.vy += dy / Math.max(d, 1) * power * dt;
    }
    return d < 22;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.spin);
    ctx.fillStyle = this.value > 10 ? '#ffe06d' : this.value > 3 ? '#d6ff77' : '#6feaff';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -this.r * 1.35);
    ctx.lineTo(this.r, 0);
    ctx.lineTo(0, this.r * 1.35);
    ctx.lineTo(-this.r, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, angle, damage, pierce, critical = false) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * 720;
    this.vy = Math.sin(angle) * 720;
    this.r = critical ? 7 : 4;
    this.damage = damage;
    this.pierce = pierce;
    this.critical = critical;
    this.life = 1.5;
    this.hit = new Set();
    this.color = critical ? '#ffe06d' : '#6bf5ff';
    this.enemyProjectile = false;
  }
  update(dt) {
    this.life -= dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
  draw() {
    ctx.save();
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.r;
    ctx.lineCap = 'round';
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(this.x - this.vx * .018, this.y - this.vy * .018);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
    ctx.restore();
  }
}

class Grenade {
  constructor(x, y, targetX, targetY, damage, radius) {
    this.x = x;
    this.y = y;
    this.startX = x;
    this.startY = y;
    this.targetX = targetX;
    this.targetY = targetY;
    this.progress = 0;
    this.damage = damage;

  update(dt) {

    if (input.has('s') || input.has('arrowdown')) dy += 1;
    if (input.has('a') || input.has('arrowleft')) dx -= 1;
    if (input.has('d') || input.has('arrowright')) dx += 1;

    if (touchState.active) {
      const tdx = touchState.x - touchState.ox;
      const tdy = touchState.y - touchState.oy;
      const mag = Math.hypot(tdx, tdy);
      if (mag > 12) {
        dx = tdx / Math.max(mag, 40);
        dy = tdy / Math.max(mag, 40);
      }
    }
    const length = Math.hypot(dx, dy) || 1;
    const targetX = (dx || dy) ? dx / length * this.speed : 0;
    const targetY = (dx || dy) ? dy / length * this.speed : 0;
    const blend = Math.min(1, dt * 16);
    this.vx = this.vx + (targetX - this.vx) * blend;
    this.vy = this.vy + (targetY - this.vy) * blend;

    this.invulnerable = Math.max(0, this.invulnerable - dt);

  updateHeading(dt) {
    const target = this.engine.nearestEnemy(this.x, this.y);
    let targetHeading;
    if (target) {
      targetHeading = Math.atan2(target.y - this.y, target.x - this.x);
    } else if (Math.abs(this.vx) + Math.abs(this.vy) > 1) {
      targetHeading = Math.atan2(this.vy, this.vx);
    } else {
      targetHeading = this.heading;
    }
    let diff = targetHeading - this.heading;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    const turnRate = (this.heading - this.prevHeading) / Math.max(dt, 1e-5);
    this.heading += diff * Math.min(1, dt * 10);
    this.tilt = this.tilt + (clamp(turnRate * .42, -.34, .34) - this.tilt) * Math.min(1, dt * 7);
    this.prevHeading = this.heading;
  }
  emitThrust(dt) {
    const speed = Math.hypot(this.vx, this.vy);
    const speedN = clamp(speed / this.speed, 0, 1);
    this.thrustTimer -= dt;
    if (this.thrustTimer <= 0) {
      this.thrustTimer = .014;
      const cos = Math.cos(this.heading);
      const sin = Math.sin(this.heading);
      const power = 40 + speedN * 120;
      for (let s = -6.5; s <= 6.5; s += 13) {
        const ox = this.x - cos * 11 - sin * s;
        const oy = this.y - sin * 11 + cos * s;
        const back = .5 + speedN * .5;
        this.engine.particles.emit(ox, oy, speedN > .35 ? '#8ff0ff' : '#6fa8ff', 1, power, 1.6, .32 + speedN * .2);
        const p = this.engine.particles.items[this.engine.particles.items.length - 1];
        if (p) {
          p.vx -= this.vx * back * .4;
          p.vy -= this.vy * back * .4;
          p.gravity = 0;

  }
  dash() {
    if (this.dashCooldown > 0 || this.engine.state !== 'playing') return;
    let dx = 0;
    let dy = 0;
    if (input.has('a') || input.has('arrowleft')) dx -= 1;
    if (input.has('d') || input.has('arrowright')) dx += 1;
    if (input.has('w') || input.has('arrowup')) dy -= 1;
    if (input.has('s') || input.has('arrowdown')) dy += 1;
    if (touchState.active) {
      const tdx = touchState.x - touchState.ox;
      const tdy = touchState.y - touchState.oy;
      if (Math.hypot(tdx, tdy) > 12) { dx = tdx; dy = tdy; }
    }
    if (!dx && !dy) dx = 1;
    const length = Math.hypot(dx, dy) || 1;
    const startX = this.x;
    const startY = this.y;
    this.x += dx / length * 165;
    this.y += dy / length * 165;
    this.dashCooldown = this.dashMax;
    this.invulnerable = .38;
    this.engine.shake = Math.max(this.engine.shake, 8);
    this.engine.particles.burst(startX, startY, ['#6bf5ff', '#fff'], 16, 220);
    this.engine.audio.dash();
  }
  damage(amount) {
    if (this.invulnerable > 0) return;
    this.hp -= amount;
    this.engine.shake = Math.max(this.engine.shake, 9);
    this.engine.particles.burst(this.x, this.y, ['#ff4f9a', '#fff'], 8, 170);
    pushFloating(this.engine.floating, new FloatingText(this.x, this.y - 28, `-${Math.round(amount)}`, '#ff709f', 18, true));
    if (this.hp <= 0) this.engine.promptRevive();
  }
  addWeapon(kind) {
    const weapon = new Weapon(kind, this.engine);
    this.weapons.push(weapon);
    this.engine.particles.burst(this.x, this.y, [weapon.color, '#fff'], 18, 180);
  }
  upgradeWeapon(kind) {
    const weapon = this.weapons.find(item => item.kind === kind);
    if (weapon) {
      weapon.level++;
      if (weapon.level >= 5 && !this.evolved[kind]) {
        this.evolved[kind] = true;
        this.engine.evolutionNotice = { name: weapon.label, timer: 3.5 };
        this.engine.audio.evolution();
        this.engine.particles.shock(this.x, this.y, '#ffe06d', 20, 300, .7);
      }
    } else this.addWeapon(kind);
  }
  draw() {
    for (const trail of this.trails) {
      const alpha = clamp(trail.life / .35, 0, 1) * .27;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#6bf5ff';
      ctx.shadowColor = '#6bf5ff';
      ctx.shadowBlur = 22;
      ctx.beginPath(); ctx.arc(trail.x, trail.y, this.r * (trail.life + .3), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (this.drones) {
      for (let i = 0; i < 2; i++) {
        const da = this.droneAngle + i * Math.PI;
        const dx = this.x + Math.cos(da) * 36;
        const dy = this.y + Math.sin(da) * 36;
        ctx.save();
        ctx.translate(dx, dy);
        ctx.shadowColor = '#b978ff'; ctx.shadowBlur = 14;
        ctx.fillStyle = '#b978ff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }

    const flicker = this.invulnerable > 0 && Math.floor(this.engine.time * 30) % 2 === 0;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.heading);
    ctx.transform(1, 0, this.tilt, 1, 0, 0);
    ctx.globalAlpha = flicker ? .45 : 1;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.shadowColor = '#37d6ff';
    ctx.shadowBlur = 46;
    ctx.fillStyle = 'rgba(55, 190, 255, .12)';
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
    ctx.restore();

    const speed = Math.hypot(this.vx, this.vy);
    const speedN = clamp(speed / this.speed, 0, 1);
    const t = performance.now() / 1000;

    const flameLen = 11 + speedN * 21 + Math.sin(t * 42) * 2.5;
    const flameW = 3 + Math.sin(t * 31) * 1;
    for (let s = 0, i = 0; s < 2; s++, i++) {
      const ly = i === 0 ? -4.6 : 4.6;
      const len = flameLen * (0.82 + Math.random() * .36);
      const grad = ctx.createLinearGradient(-8, ly, -8 - len, ly);
      grad.addColorStop(0, 'rgba(170,235,255,.96)');
      grad.addColorStop(.4, 'rgba(130,140,255,.65)');
      grad.addColorStop(1, 'rgba(90,220,255,0)');
      ctx.shadowColor = '#7cc8ff';
      ctx.shadowBlur = 20;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-7, ly - flameW);
      ctx.lineTo(-7 - len, ly);
      ctx.lineTo(-7, ly + flameW);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    const wingGrad = ctx.createLinearGradient(-14, 0, 18, 0);
    wingGrad.addColorStop(0, '#123a4e');
    wingGrad.addColorStop(.55, '#145e78');
    wingGrad.addColorStop(1, '#0d8ab5');
    for (let side = -1; side <= 1; side += 2) {
      const y = side;
      ctx.shadowColor = '#2fd0ff'; ctx.shadowBlur = 12;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.fillStyle = wingGrad;
      ctx.strokeStyle = '#2c7ba0';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-3, 3.4 * y);
      ctx.lineTo(13, 19 * y);
      ctx.lineTo(-3, 20 * y);
      ctx.lineTo(-16, 6 * y);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#bdfbff';
      ctx.lineWidth = 1.2;
      ctx.shadowColor = '#6bf5ff'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(-3, 3.4 * y); ctx.lineTo(13, 19 * y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-16, 6 * y); ctx.lineTo(-3, 20 * y); ctx.stroke();
    }
    ctx.shadowBlur = 0;

    for (let side = -1; side <= 1; side += 2) {
      const y = side;
      const cx = 13 - this.recoil * 5;
      const cy = 19 * y;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.atan2(10 * y, 28) * y);
      ctx.shadowColor = '#37d6ff'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#0b2f42';
      ctx.strokeStyle = '#4fd9ff';
      ctx.lineWidth = 1.3;
      ctx.fillRect(-3, -2.4, 15, 4.8);
      ctx.strokeRect(-3, -2.4, 15, 4.8);
      ctx.fillStyle = '#9ff2ff';
      ctx.fillRect(10, -1.2, 3, 2.4);
      if (this.muzzleFade > 0) {
        ctx.globalAlpha = this.muzzleFade;
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#9ff2ff'; ctx.shadowBlur = 18;
        ctx.beginPath(); ctx.arc(14, 0, 2.6 + this.muzzleFade * 3, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }

    const hullGrad = ctx.createLinearGradient(-20, -8, 30, 0);
    hullGrad.addColorStop(0, '#0c2230');
    hullGrad.addColorStop(.55, '#185a72');
    hullGrad.addColorStop(1, '#2ea5cf');
    ctx.shadowColor = '#0b4054'; ctx.shadowBlur = 18;
    ctx.lineJoin = 'round';
    const outline = () => {
      ctx.beginPath();
      ctx.moveTo(31, 0);
      ctx.lineTo(7, -7);
      ctx.lineTo(-18, -4.5);
      ctx.lineTo(-22, 0);
      ctx.lineTo(-18, 4.5);
      ctx.lineTo(7, 7);
      ctx.closePath();
    };
    ctx.fillStyle = hullGrad;
    ctx.strokeStyle = '#2a6f8a';
    ctx.lineWidth = 6;
    outline(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#c6fdff';
    ctx.lineWidth = 1.4;
    ctx.shadowColor = '#6bf5ff'; ctx.shadowBlur = 16;
    outline(); ctx.stroke();
    ctx.strokeStyle = 'rgba(189,251,255,.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(9, 0); ctx.stroke();
    ctx.fillStyle = 'rgba(120, 240, 255, .4)';
    ctx.strokeStyle = '#dffdff';
    ctx.lineWidth = 1;
    ctx.shadowColor = '#8ff0ff'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(5, -2.4); ctx.lineTo(22, 0); ctx.lineTo(5, 2.4); ctx.closePath();
    ctx.fill(); ctx.stroke();

    const pulse = .6 + .4 * Math.sin(t * 2.6);
    const coreR = 5.2 + pulse * 1.8;
    ctx.shadowColor = '#ff4ecb'; ctx.shadowBlur = 20;
    ctx.strokeStyle = `rgba(255, 88, 200, ${.6 + pulse * .35})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, coreR + 3, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(120, 230, 255, ${.55 + pulse * .3})`;
    ctx.lineWidth = 1.6;
    ctx.shadowColor = '#37d6ff'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(0, 0, coreR + 1.4, t * 2, t * 2 + Math.PI * (1.2 + pulse * .5));
    ctx.stroke();
    ctx.fillStyle = `rgba(255, 255, 255, ${.85 + pulse * .15})`;
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(0, 0, coreR * .72, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(80, 235, 255, ${.6 + pulse * .3})`;
    ctx.beginPath(); ctx.arc(0, 0, coreR * .45, 0, TAU); ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

const input = new Set();
const pointer = { x: 0, y: 0, down: false, moved: false };
/* Touch controls: left half = virtual stick, right half = dash.
   Desktop is unaffected (pointerType === 'mouse' never activates it). */
const touchState = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
function clearInput() {
  input.clear();
  pointer.down = false;
  touchState.active = false;
  touchState.id = null;
}
window.addEventListener('keydown', event => {
  const key = event.key.toLowerCase();
  input.add(key);
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) event.preventDefault();
  if ((key === 'escape' || key === 'p') && !event.repeat) {
    if (engine.state === 'lab') engine.state = 'menu';
    else engine.togglePause();
  }
  if (key === ' ' && !event.repeat) engine.player.dash();
  if (engine.state === 'upgrade' && ['1', '2', '3'].includes(key)) engine.chooseUpgrade(Number(key) - 1);
  if (key === 'enter' && engine.state === 'menu') engine.start();
  if (key === 'm' && !event.repeat) engine.toggleMute();
  /* Enter on the result screen returns to the menu (matches the on-screen
      button); starting a fresh run from here used to ignore the label. */
  if (key === 'enter' && engine.state === 'result') engine.returnToMenu();
});
window.addEventListener('keyup', event => input.delete(event.key.toLowerCase()));
/* Stuck-key fix: losing focus used to leave WASD held down forever. */
window.addEventListener('blur', () => {
  clearInput();
  if (engine && engine.state === 'playing') engine.pause();
});
canvas.addEventListener('pointermove', event => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = event.clientX - rect.left;
  pointer.y = event.clientY - rect.top;
  pointer.moved = true;
  if (touchState.active && event.pointerId === touchState.id) {
    touchState.x = pointer.x;
    touchState.y = pointer.y;
  }
});
canvas.addEventListener('pointerdown', event => {
  pointer.down = true;
  engine.audio.boot();
  const rect = canvas.getBoundingClientRect();
  pointer.x = event.clientX - rect.left;
  pointer.y = event.clientY - rect.top;
  /* On-screen mute / pause hit targets work for touch before stick routing. */
  const mute = engine.muteButtonRect();
  if (pointer.x >= mute.x && pointer.x <= mute.x + mute.w && pointer.y >= mute.y && pointer.y <= mute.y + mute.h) {
    engine.toggleMute();
    return;
  }
  if ((engine.state === 'playing' || engine.state === 'paused')) {
    const pauseR = engine.pauseIconRect();
    if (pointer.x >= pauseR.x && pointer.x <= pauseR.x + pauseR.w && pointer.y >= pauseR.y && pointer.y <= pauseR.y + pauseR.h) {
      engine.togglePause();
      return;
    }
  }
  if (event.pointerType === 'touch' && engine.state === 'playing') {
    if (pointer.x < viewW * .5) {
      touchState.active = true;
      touchState.id = event.pointerId;
      touchState.ox = pointer.x;
      touchState.oy = pointer.y;
      touchState.x = pointer.x;
      touchState.y = pointer.y;
      return;
    }
    /* Right half tap = dash on mobile. */
    engine.player.dash();
    return;
  }
  engine.click(pointer.x, pointer.y);
});
window.addEventListener('pointerup', event => {
  pointer.down = false;
  if (event && touchState.id != null && event.pointerId === touchState.id) {
    touchState.active = false;
    touchState.id = null;
  }
});
window.addEventListener('pointercancel', () => {
  pointer.down = false;
  touchState.active = false;
  touchState.id = null;
});

    this.kills = 0;
    this.level = 1;
    this.xp = 0;
    this.xpNext = 12;
    this.enemies = [];

    this.grenades = [];

    this.floating = [];
    this.lasers = [];
    this.areas = [];

    this.spawnTimer = 0;
    this.shake = 0;

    this.chipsRun = 0;

    this.player = new Player(this);
    this.stars = Array.from({ length: 90 }, () => ({ x: rand(-1600, 1600), y: rand(-1000, 1000), r: rand(.5, 2), a: rand(.15, .65) }));
    this.loop = this.loop.bind(this);

  }
  resetWorld() {
    this.time = 0;
    this.kills = 0;
    this.level = 1;
    this.xp = 0;
    this.xpNext = 12;
    this.enemies.length = 0;
    this.bullets.length = 0;
    this.grenades.length = 0;
    this.gems.length = 0;
    this.floating.length = 0;
    this.lasers.length = 0;
    this.areas.length = 0;
    this.upgrades.length = 0;
    this.particles.items.length = 0;
    this.particles.shockwaves.length = 0;
    this.player = new Player(this);
    this.spawnTimer = .2;
    this.camera.x = 0;
    this.camera.y = 0;
    this.shake = 0;
    this.bossesDefeated = 0;
    this.bossWarning = 0;

  buyTalent(index) {

    const cost = this.talentCost(level);
