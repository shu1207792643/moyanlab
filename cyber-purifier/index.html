    let steps = 0;
    while (this.acc >= this.step && steps < 5) {
      this.update(this.step);
      this.acc -= this.step;
      steps++;
    }
    if (this.acc > this.step * 5) this.acc = 0;
    this.render();
    requestAnimationFrame(this.loop);
  }

  update(dt) {
    this.particles.update(dt);
    for (let i = this.floating.length - 1; i >= 0; i--) { this.floating[i].update(dt); if (this.floating[i].life <= 0) this.floating.splice(i, 1); }
    this.shake *= Math.pow(.06, dt);
    if (this.evolutionNotice) {
      this.evolutionNotice.timer -= dt;
      if (this.evolutionNotice.timer <= 0) this.evolutionNotice = null;
    }

    if (this.state === 'revive') {
      /* Freeze the countdown while a rewarded ad is on screen — the ad can
         easily outlast 5s and used to auto-lose the run mid-reward. */
      if (!this.reviveAdActive) {
        this.reviveTimer -= dt;
        if (this.reviveTimer <= 0) this.lose();
      }
      return;
    }

    if (this.state !== 'playing') return;
    this.time += dt;
    this.player.update(dt);
    if (this.ready > 0) this.ready -= dt;
    if (this.bossWarning > 0) this.bossWarning -= dt;

    if (this.time >= 90 && this.bossesDefeated === 0 && !this.enemies.some(e => e.boss)) this.triggerBoss('boss1');
    if (this.time >= 180 && this.bossesDefeated === 1 && !this.enemies.some(e => e.boss)) this.triggerBoss('boss2');
    if (this.time >= 300 && this.bossesDefeated === 2 && !this.enemies.some(e => e.boss)) this.triggerBoss('boss3');

    this.spawnTimer -= dt;
    const maxEnemies = this.time < 90 ? 180 : this.time < 180 ? 230 : 260;
    if (this.spawnTimer <= 0 && this.enemies.length < maxEnemies) {
      const count = this.time < 70 ? (Math.random() < .25 ? 2 : 1) : 2;
      for (let i = 0; i < count; i++) {
        let type = 'crawler';
        if (this.bossesDefeated >= 2 && Math.random() < .22) type = 'carrier';
        else if (this.bossesDefeated >= 1 && Math.random() < .35) type = 'viper';
        this.spawnEnemy(type);
      }
      this.spawnTimer = Math.max(.14, 1.0 - this.time * .003);
    }

    for (const enemy of this.enemies) enemy.update(dt);

    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const bullet = this.bullets[i];
      bullet.update(dt);
      if (bullet.life <= 0) { this.bullets[i] = this.bullets[this.bullets.length - 1]; this.bullets.pop(); continue; }
      if (bullet.enemyProjectile) {
        const pdx = this.player.x - bullet.x;
        const pdy = this.player.y - bullet.y;
        const pr = this.player.r + bullet.r;
        if (pdx * pdx + pdy * pdy < pr * pr) {
          this.player.damage(16);
          bullet.life = 0;
        }
        continue;
      }
      for (const enemy of this.enemies) {
        if (enemy.dead || bullet.hit.has(enemy)) continue;
        const edx = enemy.x - bullet.x;
        const edy = enemy.y - bullet.y;
        const er = enemy.r + bullet.r;
        if (edx * edx + edy * edy < er * er) {
          bullet.hit.add(enemy);
          enemy.takeDamage(bullet.damage, bullet.critical, bullet.vx * .001, bullet.vy * .001);
          bullet.pierce--;
          if (bullet.pierce < 0) { bullet.life = 0; break; }
        }
      }
    }

    for (let i = this.grenades.length - 1; i >= 0; i--) {
      const grenade = this.grenades[i];
      grenade.update(dt);
      if (grenade.life <= 0) {
        this.grenades[i] = this.grenades[this.grenades.length - 1]; this.grenades.pop();
        this.particles.shock(grenade.targetX, grenade.targetY, '#ff5cab', 20, grenade.radius, .5);
        this.particles.burst(grenade.targetX, grenade.targetY, ['#ff5cab', '#6bf5ff', '#fff'], 24, 250);
        this.shake = Math.max(this.shake, 10);
        this.audio.explosion(false);
        for (const enemy of this.enemies) {
          if (enemy.dead) continue;
          const gdx = enemy.x - grenade.targetX;
          const gdy = enemy.y - grenade.targetY;
          if (gdx * gdx + gdy * gdy < grenade.radius * grenade.radius) {
            enemy.takeDamage(grenade.damage * rand(.8, 1.2), Math.random() < this.player.crit);
          }
        }
      }
    }

    for (let i = this.areas.length - 1; i >= 0; i--) {
      const a = this.areas[i];
      a.life -= dt;
      a.hitTimer -= dt;
      if (a.hitTimer <= 0) {
        a.hitTimer = .2;
        this.particles.shock(a.x, a.y, '#ffe06d', 10, a.radius, .3);
        this.shake = Math.max(this.shake, 6);
        for (const enemy of this.enemies) {
          if (enemy.dead) continue;
          const adx = enemy.x - a.x;
          const ady = enemy.y - a.y;
          if (adx * adx + ady * ady < a.radius * a.radius) enemy.takeDamage(a.damage * .25, true);
        }
      }
      if (a.life <= 0) { this.areas[i] = this.areas[this.areas.length - 1]; this.areas.pop(); }
    }

    for (let i = this.gems.length - 1; i >= 0; i--) {
      if (this.gems[i].update(dt, this.player)) {
        this.collectGem(this.gems[i]);
        this.gems[i] = this.gems[this.gems.length - 1]; this.gems.pop();
        if (this.state !== 'playing') break;
      }
    }

    for (let i = this.lasers.length - 1; i >= 0; i--) {
      const laser = this.lasers[i];
      laser.life -= dt;
      if (laser.life <= 0) { this.lasers[i] = this.lasers[this.lasers.length - 1]; this.lasers.pop(); continue; }
      if (!laser.hit && laser.life < .25) {
        laser.hit = true;
        const relX = this.player.x - laser.x;
        const relY = this.player.y - laser.y;
        const along = relX * Math.cos(laser.angle) + relY * Math.sin(laser.angle);
        const across = Math.abs(relX * Math.sin(laser.angle) - relY * Math.cos(laser.angle));
        if (along > 0 && along < 1100 && across < this.player.r + 18) this.player.damage(32);
      }
    }

    for (let i = this.enemies.length - 1; i >= 0; i--) if (this.enemies[i].dead) { this.enemies[i] = this.enemies[this.enemies.length - 1]; this.enemies.pop(); }

    for (const shock of this.particles.shockwaves) {
      for (const enemy of this.enemies) {
        if (enemy.dead || shock.hit.has(enemy) || !shock.damage) continue;
        const sdx = enemy.x - shock.x;
        const sdy = enemy.y - shock.y;
        if (sdx * sdx + sdy * sdy < shock.radius * shock.radius) { shock.hit.add(enemy); enemy.takeDamage(shock.damage); }
      }
    }

    const followX = this.player.x + this.player.vx * .1;
    const followY = this.player.y + this.player.vy * .1;
    const camBlend = 1 - Math.exp(-dt * 9);
    this.camera.x = this.camera.x + (followX - this.camera.x) * camBlend;
    this.camera.y = this.camera.y + (followY - this.camera.y) * camBlend;
  }

  triggerBoss(type) {
    this.bossWarning = 3.5;
    this.audio.warning();
    this.spawnEnemy(type);
  }
  spawnEnemy(type, x, y) {
    const angle = rand(0, TAU);
    const radius = type.startsWith('boss') ? 680 : rand(560, 780);
    this.enemies.push(new Enemy(type, x ?? this.player.x + Math.cos(angle) * radius, y ?? this.player.y + Math.sin(angle) * radius, this));
  }
  nearestEnemy(x, y) {
    let closest = null;
    let best = Infinity;
    for (const enemy of this.enemies) {
      if (enemy.dead) continue;
      const d = (enemy.x - x) ** 2 + (enemy.y - y) ** 2;
      if (d < best) { best = d; closest = enemy; }
    }
    return closest;
  }
  denseTarget() {
    if (!this.enemies.length) return null;
    let best = null;
    let bestScore = -1;
    /* Squared distance only — Math.hypot inside the O(n²) nest was a
       measurable cost once wave 3 hit 260 enemies. */
    const rangeSq = 145 * 145;
    for (const enemy of this.enemies) {
      if (enemy.dead) continue;
      let score = 0;
      for (const other of this.enemies) {
        if (other.dead || other === enemy) continue;
        const dx = enemy.x - other.x;
        const dy = enemy.y - other.y;
        if (dx * dx + dy * dy < rangeSq) score++;
      }
      if (score > bestScore) { bestScore = score; best = enemy; }
    }
    return best || this.enemies.find(e => !e.dead) || null;
  }
  awardKill(enemy) {
    const earned = enemy.boss ? (enemy.bossId === 1 ? 50 : enemy.bossId === 2 ? 120 : 300) : (enemy.type === 'carrier' ? 8 : enemy.type === 'viper' ? 3 : 1);
    this.chipsRun += earned;
  }
  bossDefeated(boss) {
    this.bossesDefeated = Math.max(this.bossesDefeated, boss.bossId);
    this.sdk.happytime();
    this.particles.shock(this.player.x, this.player.y, '#c7ff62', 10, 800, .9, 200);
    this.floating.push(new FloatingText(boss.x, boss.y - 40, 'BOSS ELIMINATED!', '#ffe06d', 26, true));
    if (boss.bossId === 3 && !this.endless) {
      setTimeout(() => this.win(), 1500);
    }
  }

  bossRing(boss, count = 18) {
    for (let i = 0; i < count; i++) {
      const a = i * TAU / count + this.time * .2;
      this.bullets.push(new Bullet(boss.x, boss.y, a, 0, 0, false));
      const b = this.bullets[this.bullets.length - 1];
      b.vx = Math.cos(a) * 190;
      b.vy = Math.sin(a) * 190;
      b.r = 6;
      b.life = 3.6;
      b.enemyProjectile = true;
      b.color = '#ff4f9a';
    }
    this.audio.tone(70, .22, 'sawtooth', .07, 1.4);
  }
  bossSpiral(boss) {
    for (let i = 0; i < 4; i++) {
      const a = this.time * 3 + i * (TAU / 4);
      this.bullets.push(new Bullet(boss.x, boss.y, a, 0, 0, false));
      const b = this.bullets[this.bullets.length - 1];
      b.vx = Math.cos(a) * 220;
      b.vy = Math.sin(a) * 220;
      b.r = 7;
      b.life = 4;
      b.enemyProjectile = true;
      b.color = '#b86bff';
    }
  }
  bossLaser(boss, tracking = false) {
    const a = angleTo(boss, this.player) + (tracking ? 0 : rand(-.3, .3));
    this.lasers.push({ x: boss.x, y: boss.y, angle: a, life: 1.35, hit: false });
    this.shake = Math.max(this.shake, 6);
    this.audio.tone(120, .65, 'sawtooth', .06, .5);
  }
  bossCharge(boss) {
    const a = angleTo(boss, this.player);
    boss.vx = Math.cos(a) * 380;
    boss.vy = Math.sin(a) * 380;
    this.particles.shock(boss.x, boss.y, '#ff315d', 10, 120, .4);
    this.audio.warning();
  }
  spawnGuardians(boss) {
    for (let i = 0; i < 3; i++) {
      this.spawnEnemy('crawler', boss.x + rand(-50, 50), boss.y + rand(-50, 50));
    }
  }
  bossTeleport(boss) {
    this.particles.shock(boss.x, boss.y, '#ff315d', 20, 180, .5);
    const a = rand(0, TAU);
    boss.x = this.player.x + Math.cos(a) * 280;
    boss.y = this.player.y + Math.sin(a) * 280;
    this.bossRing(boss, 16);
  }
  bossStrike(boss) {
    for (let i = 0; i < 3; i++) {
      const ox = this.player.x + rand(-220, 220);
      const oy = this.player.y + rand(-220, 220);
      this.areas.push({ x: ox, y: oy, radius: 95, damage: 45, life: 1.2, maxLife: 1.2, hitTimer: .6 });
    }
  }
  enemyShot(enemy) {
    const a = angleTo(enemy, this.player);
    this.bullets.push(new Bullet(enemy.x, enemy.y, a, 0, 0, false));
    const b = this.bullets[this.bullets.length - 1];
    b.vx = Math.cos(a) * 230;
    b.vy = Math.sin(a) * 230;
    b.r = 5;
    b.life = 3;
    b.enemyProjectile = true;
    b.color = enemy.color;
  }

  collectGem(gem) {
    this.xp += gem.value;
    this.particles.sparks(this.player.x, this.player.y, '#c7ff62', 4);
    let leveled = false;
    while (this.xp >= this.xpNext) {
      this.xp -= this.xpNext;
      this.level++;
      this.xpNext = Math.floor(this.xpNext * 1.24 + 5);
      this.pendingUpgrades++;
      leveled = true;
    }
    if (leveled && this.state === 'playing') this.openUpgrade();
  }
  openUpgrade() {
    if (this.pendingUpgrades <= 0) return;
    this.pendingUpgrades--;
    this.state = 'upgrade';
    this.upgrades = this.makeUpgrades();
    this.rerollUsed = false;
    this.sdk.gameplayStop();
    this.audio.levelUp();
    this.particles.burst(this.player.x, this.player.y, ['#c7ff62', '#6bf5ff', '#fff'], 26, 220);
  }
  makeUpgrades() {
    const choices = [];
    const has = kind => this.player.weapons.some(w => w.kind === kind);
    const weaponChoice = (kind, title, desc, accent) => ({ kind: 'weapon', value: kind, title, description: desc, accent, icon: kind === 'plasma' ? '⌁' : kind === 'blade' ? '✦' : '✸' });
    if (!has('blade')) choices.push(weaponChoice('blade', 'UNLOCK · CYBER BLADES', 'Deploy 2 orbiting energy blades to slice & knock back nearby foes.', '#c7ff62'));
    if (!has('grenade')) choices.push(weaponChoice('grenade', 'UNLOCK · EMP GRENADE', 'Launch electromagnetic grenades that trigger shockwaves in dense swarms.', '#ff5cab'));
    const owned = this.player.weapons[Math.floor(rand(0, this.player.weapons.length))];
    choices.push({ kind: 'weaponUpgrade', value: owned.kind, title: `UPGRADE · ${owned.label}`, description: `Enhance firepower module. Level ${owned.level} → ${owned.level + 1}.`, accent: owned.color, icon: '⬢' });
    choices.push({ kind: 'speed', value: 1, title: 'MOVE SPEED +15%', description: 'Overdrive thrusters for faster dodging through bullet hell.', accent: '#6bf5ff', icon: '➤' });
    choices.push({ kind: 'magnet', value: 1, title: 'MAGNET RANGE +30%', description: 'Expand crystal pickup radius for accelerated progression.', accent: '#72ffcf', icon: '◎' });
    choices.push({ kind: 'crit', value: 1, title: 'CRIT CHANCE +10%', description: 'Increase chance to trigger high-damage explosive crits.', accent: '#ffe06d', icon: '✹' });
    choices.push({ kind: 'health', value: 1, title: 'REPAIR HULL +35', description: 'Restore hull integrity and increase Max HP by 15.', accent: '#ff7f9e', icon: '＋' });
    choices.push({ kind: 'damage', value: 1, title: 'WEAPON DAMAGE +18%', description: 'Boost global damage output across all equipped arsenal.', accent: '#b978ff', icon: '◈' });
    const selected = [];
    while (selected.length < 3 && choices.length) {
      const idx = Math.floor(Math.random() * choices.length);
      selected.push(choices.splice(idx, 1)[0]);
    }
    return selected;
  }
  chooseUpgrade(index) {
    if (this.state !== 'upgrade' || !this.upgrades[index]) return;
    const choice = this.upgrades[index];
    if (choice.kind === 'weapon') this.player.addWeapon(choice.value);
    if (choice.kind === 'weaponUpgrade') this.player.upgradeWeapon(choice.value);
    if (choice.kind === 'speed') this.player.speed *= 1.15;
    if (choice.kind === 'magnet') this.player.magnet *= 1.3;
    if (choice.kind === 'crit') this.player.crit = Math.min(.65, this.player.crit + .1);
    if (choice.kind === 'health') { this.player.maxHp += 15; this.player.hp = Math.min(this.player.maxHp, this.player.hp + 35); }
    if (choice.kind === 'damage') this.player.damageBonus = (this.player.damageBonus || 1) * 1.18;
    this.audio.click();
    if (this.pendingUpgrades > 0) {
      this.pendingUpgrades--;
      this.upgrades = this.makeUpgrades();
      this.rerollUsed = false;
      this.audio.levelUp();
      return;
    }
    this.state = 'playing';
    this.sdk.gameplayStart();
  }
  rerollCards() {
    if (this.rerollUsed) return;
    this.sdk.rewarded(() => {
      this.upgrades = this.makeUpgrades();
      this.rerollUsed = true;
      this.audio.levelUp();
    });
  }

  promptRevive() {
    if (this.reviveUsed || this.reviveAdActive) { this.lose(); return; }
    this.state = 'revive';
    this.reviveTimer = 5;
    this.reviveAdActive = false;
    this.sdk.gameplayStop();
    this.audio.warning();
  }
  acceptRevive() {
    if (this.reviveAdActive || this.reviveUsed) return;
    const started = this.sdk.rewarded(() => {
      this.reviveAdActive = false;
      this.reviveUsed = true;
      this.player.hp = this.player.maxHp;
      this.player.invulnerable = 3.5;
      this.ready = 3;
      this.state = 'playing';
      this.particles.shock(this.player.x, this.player.y, '#6bf5ff', 20, 800, .8, 300);
      this.audio.levelUp();
      this.sdk.gameplayStart();
    }, () => {
      this.reviveAdActive = false;
      this.lose();
    });
    if (started) this.reviveAdActive = true;
  }

  win() {
    if (this.state === 'result') return;
    this.clearSave();
    this.saveMetaStats(true);
    this.state = 'result';
    this.resultVictory = true;
    this.sdk.gameplayStop();
    this.sdk.midgame();
  }
  lose() {
    if (this.state === 'result') return;
    this.clearSave();
    this.saveMetaStats(false);
    this.state = 'result';
    this.resultVictory = false;
    this.audio.explosion(true);
    this.sdk.gameplayStop();
    this.sdk.midgame();
  }
  saveMetaStats(victory) {
    this.meta.chips += this.chipsRun;
    if (this.time > (this.meta.bestScore?.time || 0)) this.meta.bestScore.time = this.time;
    if (this.kills > (this.meta.bestScore?.kills || 0)) this.meta.bestScore.kills = this.kills;
    writeMeta(this.meta);
    this.refreshMenuSave();
  }
  claimDoubleChips() {
    if (this.doubleClaimed) return;
    this.sdk.rewarded(() => {
      this.meta.chips += this.chipsRun;
      this.chipsRun *= 2;
      this.doubleClaimed = true;
      writeMeta(this.meta);
      this.audio.levelUp();
    });
  }

  click(x, y) {
    if (this.state === 'menu') {
      const resumed = this.resumeButton();
      if (this._hasSave && x >= resumed.x && x <= resumed.x + resumed.w && y >= resumed.y && y <= resumed.y + resumed.h) { this.loadRun(); return; }
      const button = this.menuButton();
      if (x >= button.x && x <= button.x + button.w && y >= button.y && y <= button.y + button.h) { this.start(); return; }
      const labBtn = this.labButton();
      if (x >= labBtn.x && x <= labBtn.x + labBtn.w && y >= labBtn.y && y <= labBtn.y + labBtn.h) { this.openLab(); return; }
    } else if (this.state === 'lab') {
      const backBtn = { x: 30, y: 30, w: 110, h: 42 };
      if (x >= backBtn.x && x <= backBtn.x + backBtn.w && y >= backBtn.y && y <= backBtn.y + backBtn.h) { this.state = 'menu'; return; }
      const supplyBtn = this.supplyButton();
      if (x >= supplyBtn.x && x <= supplyBtn.x + supplyBtn.w && y >= supplyBtn.y && y <= supplyBtn.y + supplyBtn.h) { this.claimSupply(); return; }
      TALENTS.forEach((talent, idx) => {
        const btn = this.talentButton(idx);
        if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) this.buyTalent(idx);
      });
    } else if (this.state === 'paused') {
      const rects = this.pauseButtons();
      const hit = r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
      if (hit(rects[0])) this.resume();
      else if (hit(rects[1])) this.saveRun();
      else if (hit(rects[2])) this.abandonRun();
    } else if (this.state === 'upgrade') {
      const cards = this.cardRects();
      cards.forEach((rect, idx) => { if (x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h) this.chooseUpgrade(idx); });
      const reroll = this.rerollButton();
      if (!this.rerollUsed && x >= reroll.x && x <= reroll.x + reroll.w && y >= reroll.y && y <= reroll.y + reroll.h) this.rerollCards();
    } else if (this.state === 'revive') {
      if (this.reviveAdActive) return;
      const btn = this.reviveModalButton();
      if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) this.acceptRevive();
      const giveUp = { x: viewW / 2 - 80, y: viewH * .68, w: 160, h: 36 };
      if (x >= giveUp.x && x <= giveUp.x + giveUp.w && y >= giveUp.y && y <= giveUp.y + giveUp.h) this.lose();
    } else if (this.state === 'result') {
      const button = this.resultButton();
      if (x >= button.x && x <= button.x + button.w && y >= button.y && y <= button.y + button.h) { this.returnToMenu(); return; }
      const doubleBtn = this.doubleButton();
      if (!this.doubleClaimed && x >= doubleBtn.x && x <= doubleBtn.x + doubleBtn.w && y >= doubleBtn.y && y <= doubleBtn.y + doubleBtn.h) this.claimDoubleChips();
    }
  }

  menuButton() { return { x: viewW / 2 - 118, y: viewH * .65, w: 236, h: 52 }; }
  resumeButton() { return { x: viewW / 2 - 128, y: viewH * .54, w: 256, h: 48 }; }
  labButton() { return { x: viewW / 2 - 118, y: viewH * .76, w: 236, h: 46 }; }
  pauseButtons() {
    const w = 300, h = 52;
    const x = viewW / 2 - w / 2;
    return [0, 1, 2].map(i => ({ x, y: viewH / 2 - 96 + i * 66, w, h }));
  }
  resultButton() { return { x: viewW / 2 - 108, y: viewH * .73, w: 216, h: 52 }; }
  doubleButton() { return { x: viewW / 2 - 128, y: viewH * .62, w: 256, h: 48 }; }
  rerollButton() { return { x: viewW / 2 - 120, y: viewH * .83, w: 240, h: 42 }; }
  reviveModalButton() { return { x: viewW / 2 - 140, y: viewH * .56, w: 280, h: 56 }; }
  supplyButton() { return { x: viewW - 240, y: 30, w: 200, h: 42 }; }
  talentCard(idx) {
    const cardW = Math.min(560, viewW - 32);
    const cardH = 86;
    const cardX = viewW / 2 - cardW / 2;
    const cardY = 115 + idx * 96;
    return { x: cardX, y: cardY, w: cardW, h: cardH };
  }
  talentButton(idx) {
    const card = this.talentCard(idx);
    return { x: card.x + card.w - 126, y: card.y + 23, w: 110, h: 40 };
  }
  cardRects() {
    const gap = Math.min(22, viewW * .018);
    const width = Math.min(310, (viewW - 70 - gap * 2) / 3);
    const total = width * 3 + gap * 2;
    const start = (viewW - total) / 2;
    return [0, 1, 2].map(i => ({ x: start + i * (width + gap), y: viewH * .28, w: width, h: Math.min(320, viewH * .48) }));
  }

  render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, viewW, viewH);
    this.drawBackdrop();
    if (this.state === 'menu') this.drawMenu();
    else if (this.state === 'lab') this.drawLab();
    else {
      const shakeX = rand(-this.shake, this.shake);
      const shakeY = rand(-this.shake, this.shake);
      ctx.save();
      ctx.translate(viewW / 2 - this.camera.x + shakeX, viewH / 2 - this.camera.y + shakeY);
      this.drawWorld();
      ctx.restore();
      this.drawHud();
      if (this.state === 'playing' && this.ready > 0) this.drawReady();
      if (this.state === 'paused') this.drawPause();
      if (this.state === 'upgrade') this.drawUpgrade();
      if (this.state === 'revive') this.drawRevive();
      if (this.state === 'result') this.drawResult();
    }
  }

  drawBackdrop() {
    if (!this._bgGrad) {
      const gradient = ctx.createRadialGradient(viewW * .5, viewH * .42, 30, viewW * .5, viewH * .5, Math.max(viewW, viewH) * .75);
      gradient.addColorStop(0, '#101b2c');
      gradient.addColorStop(.5, '#080e1b');
      gradient.addColorStop(1, '#03050a');
      this._bgGrad = gradient;
    }
    ctx.fillStyle = this._bgGrad;
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.save();
    ctx.globalAlpha = .24;
    ctx.strokeStyle = '#24526f';
    ctx.lineWidth = 1;
    const grid = 42;
    const ox = ((this.camera.x * .12) % grid + grid) % grid;
    const oy = ((this.camera.y * .12) % grid + grid) % grid;
    ctx.beginPath();
    for (let x = -grid + ox; x < viewW + grid; x += grid) { ctx.moveTo(x, 0); ctx.lineTo(x, viewH); }
    for (let y = -grid + oy; y < viewH + grid; y += grid) { ctx.moveTo(0, y); ctx.lineTo(viewW, y); }
    ctx.stroke();
    ctx.globalAlpha = .35;
    /* Wrap stars into a band around the camera so far-offscreen ones never cost fill. */
    const spanX = 1600 * 2;
    const spanY = 1000 * 2;
    const camSX = this.camera.x * .2;
    const camSY = this.camera.y * .2;
    for (const star of this.stars) {
      let sx = ((star.x - camSX + spanX / 2) % spanX + spanX) % spanX - spanX / 2 + viewW / 2;
      let sy = ((star.y - camSY + spanY / 2) % spanY + spanY) % spanY - spanY / 2 + viewH / 2;
      ctx.globalAlpha = star.a;
      ctx.fillStyle = '#7bdcff';
      ctx.beginPath();
      ctx.arc(sx, sy, star.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  drawWorld() {
    for (const laser of this.lasers) {
      ctx.save();
      ctx.translate(laser.x, laser.y);
      ctx.rotate(laser.angle);
      const a = clamp(laser.life / 1.35, 0, 1);
      ctx.globalAlpha = .14 + (1 - a) * .5;
      ctx.fillStyle = '#ff5cab';
      ctx.shadowColor = '#ff5cab';
      ctx.shadowBlur = 30;
      ctx.fillRect(0, -9, 1100, 18);
      ctx.globalAlpha = .85;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, -2, 1100, 4);
      ctx.restore();
    }
    for (const a of this.areas) {
      ctx.save();
      ctx.shadowColor = '#ffe06d'; ctx.shadowBlur = 25;
      ctx.strokeStyle = '#ffe06d'; ctx.lineWidth = 3;
      ctx.fillStyle = 'rgba(255, 224, 109, .15)';
      ctx.beginPath(); ctx.arc(a.x, a.y, a.radius, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    for (const gem of this.gems) gem.draw();
    for (const grenade of this.grenades) grenade.draw();
    for (const bullet of this.bullets) if (!bullet.enemyProjectile) bullet.draw();
    for (const enemy of this.enemies) enemy.draw();
    for (const weapon of this.player.weapons) weapon.draw();
    this.player.draw();
    this.particles.draw();
    for (const floating of this.floating) floating.draw();
    for (const bullet of this.bullets) {
      if (!bullet.enemyProjectile) continue;
      ctx.save(); ctx.fillStyle = bullet.color; ctx.shadowColor = bullet.color; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(bullet.x, bullet.y, bullet.r, 0, TAU); ctx.fill(); ctx.restore();
    }
  }

  drawReady() {
    const rest = Math.max(0, this.ready);
    const sx = viewW / 2 - this.camera.x;
    const sy = viewH / 2 - this.camera.y;
    const px = sx + this.player.x;
    const py = sy + this.player.y;
    ctx.save();
    ctx.fillStyle = 'rgba(60, 210, 255, .055)';
    ctx.fillRect(0, 0, viewW, viewH);
    const aura = ctx.createRadialGradient(px, py, 14, px, py, 78);
    aura.addColorStop(0, 'rgba(130, 245, 255, .5)');
    aura.addColorStop(1, 'rgba(130, 245, 255, 0)');
    ctx.globalAlpha = .5 + .5 * Math.sin(performance.now() * .012);
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(px, py, 78, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowColor = '#37d6ff'; ctx.shadowBlur = 24;
    ctx.strokeStyle = 'rgba(160, 245, 255, .75)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([6, 9]);
    ctx.beginPath(); ctx.arc(px, py, 40 + Math.sin(performance.now() * .01) * 4, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    const n = Math.ceil(rest);
    const frac = rest - Math.floor(Math.max(0, rest));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${64 + frac * 18}px "Segoe UI", sans-serif`;
    ctx.fillStyle = '#c9feff';
    ctx.shadowColor = '#37d6ff'; ctx.shadowBlur = 34;
    ctx.fillText(rest > 0 ? `${Math.max(1, n)}` : 'GO', px, py - 64);
    ctx.font = '700 13px "Segoe UI", sans-serif';
    ctx.fillStyle = '#8fd4ff';
    ctx.fillText('SHIELD ONLINE  //  STANDBY', px, py - 32);
    ctx.restore();
  }

  drawHud() {
    const pad = Math.max(18, viewW * .025);
    const barW = Math.min(310, viewW * .29);
    ctx.save();
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.font = '800 11px "Segoe UI", sans-serif';
    ctx.fillStyle = '#78a0b5';
    ctx.fillText('PILOT // ZERO-07', pad, 26);
    ctx.font = '700 27px "Segoe UI", sans-serif';
    ctx.fillStyle = '#dff9ff';
    ctx.fillText(fmtTime(this.time), pad, 52);
    ctx.font = '600 10px "Segoe UI", sans-serif';
    ctx.fillStyle = '#70889b';
    ctx.fillText(`DATA CHIPS: ${this.chipsRun}`, pad, 76);
    this.bar(pad, 96, barW, 9, this.player.hp / this.player.maxHp, '#ff5d96', 'HP');
    this.bar(pad, 118, barW, 6, this.xp / this.xpNext, '#c7ff62', `LV ${this.level}`);
    ctx.textAlign = 'right';
    ctx.font = '800 13px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ff729e';
    ctx.fillText(`${String(this.kills).padStart(4, '0')}  KILLS`, viewW - pad, 31);
    ctx.font = '600 11px "Segoe UI", sans-serif';
    ctx.fillStyle = '#7692a6';
    ctx.fillText(this.time < 90 ? 'WAVE 01 // CRAWLER SWARM' : this.time < 180 ? 'WAVE 02 // VIPER CORVETTE' : 'WAVE 03 // FRACTURE CARRIER', viewW - pad, 52);
    const dashX = viewW - pad - 170;
    this.bar(dashX, 96, 170, 6, 1 - this.player.dashCooldown / this.player.dashMax, '#6bf5ff', 'DASH');
    ctx.font = '600 10px "Segoe UI", sans-serif';
    ctx.fillStyle = '#7a9bab';
    ctx.textAlign = 'center';
    ctx.fillText(isTouchDevice()
      ? 'DRAG LEFT SIDE TO MOVE · TAP RIGHT SIDE TO DASH'
      : 'WASD / ARROWS MOVE · SPACE DASH · ESC PAUSE · M MUTE', viewW / 2, viewH - 22);
    ctx.textAlign = 'right';
    this.drawMuteButton(viewW - pad, viewH - 52);
    if (this.state === 'playing' || this.state === 'paused') this.drawPauseIcon(viewW - pad, viewH - 100);

    if (this.bossWarning > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = Math.floor(this.time * 8) % 2 === 0 ? '#ff315d' : '#fff';
      ctx.shadowColor = '#ff315d'; ctx.shadowBlur = 30;
      ctx.font = '900 36px "Segoe UI", sans-serif';
      ctx.fillText('⚠️ WARNING: MASSIVE SIGNAL INCOMING ⚠️', viewW / 2, viewH * .22);
    }

    if (this.evolutionNotice) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffe06d'; ctx.shadowColor = '#ffe06d'; ctx.shadowBlur = 24;
      ctx.font = '900 24px "Segoe UI", sans-serif';
      ctx.fillText(`⚡ HYPER-WEAPON EVOLVED: ${this.evolutionNotice.name} ⚡`, viewW / 2, viewH * .18);
    }

    const boss = this.enemies.find(enemy => enemy.boss);
    if (boss) {
      const width = Math.min(650, viewW * .56);
      const x = (viewW - width) / 2;
      ctx.textAlign = 'center';
      ctx.font = '800 12px "Segoe UI", sans-serif';
      ctx.fillStyle = '#e0b7ff';
      const bName = boss.bossId === 1 ? 'OBLIVION CORE · ALPHA' : boss.bossId === 2 ? 'VOID DREADNOUGHT · BETA' : 'TITAN OVERLORD · OMEGA';
      ctx.fillText(`${bName} // CRITICAL THREAT`, viewW / 2, 31);
      ctx.fillStyle = 'rgba(4, 7, 14, .8)';
      ctx.fillRect(x, 43, width, 10);
      ctx.fillStyle = boss.shielded ? '#6bf5ff' : '#bd72ff';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 13;
      ctx.fillRect(x, 43, width * clamp(boss.hp / boss.maxHp, 0, 1), 10);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(223, 183, 255, .65)'; ctx.strokeRect(x, 43, width, 10);
    }
    ctx.restore();
  }

  bar(x, y, width, height, ratio, color, label) {
    ctx.save();
    ctx.font = '700 10px "Segoe UI", sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8fb0c0';
    ctx.fillText(label, x - 8, y + height / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(3, 9, 16, .8)';
    ctx.fillRect(x, y, width, height);
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 10;
    ctx.fillRect(x, y, width * clamp(ratio, 0, 1), height);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(152, 213, 233, .28)'; ctx.strokeRect(x, y, width, height);
    ctx.restore();
  }

  muteButtonRect() { return { x: viewW - Math.max(18, viewW * .025) - 36, y: viewH - 52, w: 36, h: 36 }; }
  pauseIconRect() { return { x: viewW - Math.max(18, viewW * .025) - 36, y: viewH - 100, w: 36, h: 36 }; }
  drawMuteButton(rx) {
    const r = { x: rx - 36, y: viewH - 52, w: 36, h: 36 };
    const hov = pointer.x >= r.x && pointer.x <= r.x + r.w && pointer.y >= r.y && pointer.y <= r.y + r.h;
    ctx.save();
    ctx.fillStyle = hov ? 'rgba(107,245,255,.22)' : 'rgba(107,245,255,.1)';
    ctx.strokeStyle = hov ? '#c6fcff' : 'rgba(107,245,255,.55)';
    ctx.lineWidth = 1.2;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '16px "Segoe UI Emoji", "Segoe UI", sans-serif';
    ctx.fillStyle = '#c9faff';
    ctx.fillText(this.meta.muted ? '🔇' : '🔊', r.x + r.w / 2, r.y + r.h / 2 + 1);
    ctx.restore();
  }
  drawPauseIcon(rx) {
    const r = { x: rx - 36, y: viewH - 100, w: 36, h: 36 };
    const hov = pointer.x >= r.x && pointer.x <= r.x + r.w && pointer.y >= r.y && pointer.y <= r.y + r.h;
    ctx.save();
    ctx.fillStyle = hov ? 'rgba(107,245,255,.22)' : 'rgba(107,245,255,.1)';
    ctx.strokeStyle = hov ? '#c6fcff' : 'rgba(107,245,255,.55)';
    ctx.lineWidth = 1.2;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#c9faff';
    ctx.fillRect(r.x + 11, r.y + 10, 5, 16);
    ctx.fillRect(r.x + 20, r.y + 10, 5, 16);
    ctx.restore();
  }

  drawMenu() {
    const pulse = .5 + Math.sin(performance.now() * .002) * .5;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 墨焱实验室专属 Logo
    if (moyanLogoImg.complete && moyanLogoImg.naturalWidth > 0) {
      const logoSize = Math.min(82, viewW * .07);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const px = viewW / 2 - logoSize / 2;
      const py = viewH * .13 - logoSize / 2;
      ctx.drawImage(moyanLogoImg, px, py, logoSize, logoSize);
      ctx.restore();
    }

    ctx.fillStyle = '#6bf5ff';
    ctx.font = '800 11px "Segoe UI", sans-serif';
    ctx.fillText('MOYAN LAB PRESENTS // CYPHER DIVISION', viewW / 2, viewH * .21);
    ctx.shadowColor = '#6bf5ff'; ctx.shadowBlur = 28;
    ctx.fillStyle = '#e4fbff';
    ctx.font = `900 ${Math.min(74, viewW * .075)}px "Segoe UI", sans-serif`;
    ctx.fillText('CYBER PURIFIER', viewW / 2, viewH * .27);
    ctx.shadowColor = '#ff4e9b'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#ff6ba9';
    ctx.font = `800 ${Math.min(25, viewW * .025)}px "Segoe UI", sans-serif`;
    ctx.fillText('PROTOCOL ZERO', viewW / 2, viewH * .36);
    ctx.shadowBlur = 0;
    ctx.font = '600 13px "Segoe UI", sans-serif';
    ctx.fillStyle = '#7f9bac';
    ctx.fillText(`TOTAL CHIPS: 💾 ${this.meta.chips}   ·   BEST: ${fmtTime(this.meta.bestScore?.time || 0)} (${this.meta.bestScore?.kills || 0} KILLS)`, viewW / 2, viewH * .45);

    this.drawMuteButton(viewW - Math.max(18, viewW * .025));

    if (this._hasSave) {
      const sum = this._saveSum;
      const rb = this.resumeButton();
      const rh = pointer.x >= rb.x && pointer.x <= rb.x + rb.w && pointer.y >= rb.y && pointer.y <= rb.y + rb.h;
      const repr = sum ? `⚡ RESUME RUN (WAVE ${sum.wave} - ${fmtTime(sum.time)})` : '⚡ RESUME RUN';
      ctx.fillStyle = rh ? 'rgba(199,255,98,.22)' : 'rgba(199,255,98,.1)';
      ctx.strokeStyle = rh ? '#eaffb6' : '#c7ff62';
      ctx.lineWidth = rh ? 2.5 : 1.5;
      ctx.shadowColor = '#c7ff62'; ctx.shadowBlur = rh ? 30 : 14;
      ctx.fillRect(rb.x, rb.y, rb.w, rb.h);
      ctx.strokeRect(rb.x, rb.y, rb.w, rb.h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f1ffe0';
      ctx.font = '800 14px "Segoe UI", sans-serif';
      ctx.fillText(repr, viewW / 2, rb.y + rb.h / 2 + 1);
    }

    const button = this.menuButton();
    const hover = pointer.x >= button.x && pointer.x <= button.x + button.w && pointer.y >= button.y && pointer.y <= button.y + button.h;
    ctx.fillStyle = hover ? 'rgba(107, 245, 255, .21)' : 'rgba(107, 245, 255, .1)';
    ctx.strokeStyle = hover ? '#c6fcff' : '#6bf5ff';
    ctx.lineWidth = hover ? 2.5 : 1.5;
    ctx.shadowColor = '#6bf5ff'; ctx.shadowBlur = hover ? 28 : 15;
    ctx.fillRect(button.x, button.y, button.w, button.h);
    ctx.strokeRect(button.x, button.y, button.w, button.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#e8fdff';
    ctx.font = '800 14px "Segoe UI", sans-serif';
    ctx.fillText('INITIALIZE RUN', viewW / 2, button.y + button.h / 2 + 1);

    const labBtn = this.labButton();
    const labHov = pointer.x >= labBtn.x && pointer.x <= labBtn.x + labBtn.w && pointer.y >= labBtn.y && pointer.y <= labBtn.y + labBtn.h;
    ctx.fillStyle = labHov ? 'rgba(185, 120, 255, .25)' : 'rgba(185, 120, 255, .12)';
    ctx.strokeStyle = labHov ? '#d7a7ff' : '#b978ff';
    ctx.lineWidth = labHov ? 2.5 : 1.5;
    ctx.shadowColor = '#b978ff'; ctx.shadowBlur = labHov ? 28 : 14;
    ctx.fillRect(labBtn.x, labBtn.y, labBtn.w, labBtn.h);
    ctx.strokeRect(labBtn.x, labBtn.y, labBtn.w, labBtn.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#f5e8ff';
    ctx.font = '800 13px "Segoe UI", sans-serif';
    ctx.fillText('🧬 CYBER LAB // TALENTS', viewW / 2, labBtn.y + labBtn.h / 2 + 1);

    ctx.font = '600 10px "Segoe UI", sans-serif';
    ctx.fillStyle = `rgba(199, 255, 98, ${.52 + pulse * .35})`;
    ctx.fillText('WASD / ARROWS TO MOVE   ·   SPACE TO DASH', viewW / 2, viewH * .88);
    ctx.restore();
  }

  drawLab() {
    ctx.save();
    ctx.fillStyle = 'rgba(2, 6, 14, .92)';
    ctx.fillRect(0, 0, viewW, viewH);

    ctx.fillStyle = 'rgba(185, 120, 255, .15)';
    ctx.strokeStyle = '#b978ff';
    ctx.strokeRect(30, 30, 110, 42);
    ctx.fillRect(30, 30, 110, 42);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.font = '800 13px "Segoe UI", sans-serif';
    ctx.fillText('← BACK', 85, 51);

    const supply = this.supplyButton();
    const claimed = dailyClaimed(this.meta);
    const supHov = pointer.x >= supply.x && pointer.x <= supply.x + supply.w && pointer.y >= supply.y && pointer.y <= supply.y + supply.h;
    ctx.fillStyle = claimed ? 'rgba(80, 80, 80, .2)' : (supHov ? 'rgba(255, 224, 109, .28)' : 'rgba(255, 224, 109, .14)');
    ctx.strokeStyle = claimed ? '#555' : '#ffe06d';
    ctx.strokeRect(supply.x, supply.y, supply.w, supply.h);
    ctx.fillRect(supply.x, supply.y, supply.w, supply.h);
    ctx.fillStyle = claimed ? '#777' : '#fff';
    ctx.font = '800 12px "Segoe UI", sans-serif';
    ctx.fillText(claimed ? '✓ CLAIMED (+500)' : '🎬 FREE +500 CHIPS', supply.x + supply.w / 2, supply.y + supply.h / 2);

    ctx.fillStyle = '#b978ff'; ctx.shadowColor = '#b978ff'; ctx.shadowBlur = 20;
    ctx.font = '900 28px "Segoe UI", sans-serif';
    ctx.fillText('CYBERNETIC TALENT LAB', viewW / 2, 54);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#8fa7b7'; ctx.font = '600 12px "Segoe UI", sans-serif';
    ctx.fillText(`AVAILABLE DATA CHIPS: 💾 ${this.meta.chips}`, viewW / 2, 84);

    const icons = { armor: '🛡️', engine: '⚡', magnet: '🧲', capacitor: '💥', wingman: '🛸' };
    TALENTS.forEach((talent, idx) => {
      const card = this.talentCard(idx);
      const lv = this.meta.talents[talent.key] || 0;
      const cost = this.talentCost(lv);
      const btn = this.talentButton(idx);

      ctx.fillStyle = 'rgba(10, 22, 38, .88)';
      ctx.strokeStyle = rgba(talent.color, .4);
      ctx.lineWidth = 1;
      roundRectPath(ctx, card.x, card.y, card.w, card.h, 10);
      ctx.fill(); ctx.stroke();

      const iconX = card.x + 16;
      const iconY = card.y + (card.h - 50) / 2;
      ctx.fillStyle = 'rgba(4, 10, 20, .74)';
      ctx.strokeStyle = rgba(talent.color, .55);
      ctx.lineWidth = 1.2;
      ctx.shadowColor = talent.color; ctx.shadowBlur = 8;
      roundRectPath(ctx, iconX, iconY, 50, 50, 9);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '23px "Segoe UI Emoji", "Segoe UI", sans-serif';
      ctx.fillText(icons[talent.key] || '◆', iconX + 25, iconY + 27);

      const midX = card.x + 78;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = talent.color;
      ctx.font = '800 15px "Segoe UI", sans-serif';
      ctx.fillText(talent.name, midX, card.y + 24);
      const nameW = ctx.measureText(talent.name).width;
      ctx.fillStyle = '#dfe9ff';
      ctx.font = '800 11px "Segoe UI", sans-serif';
      ctx.fillText(`[ LV ${lv}/5 ]`, midX + nameW + 8, card.y + 24);
      ctx.fillStyle = '#8aa2b3';
      ctx.font = '500 11px "Segoe UI", sans-serif';
      ctx.fillText(talent.desc, midX, card.y + 45);

      const slotW = 22, slotH = 7, slotGap = 4;
      for (let s = 0; s < 5; s++) {
        const sx = midX + s * (slotW + slotGap);
        const sy = card.y + 62;
        const filled = s < lv;
        ctx.fillStyle = filled ? talent.color : 'rgba(30, 42, 55, .55)';
        ctx.strokeStyle = filled ? '#fff' : 'rgba(120, 150, 165, .35)';
        ctx.shadowColor = talent.color; ctx.shadowBlur = filled ? 10 : 0;
        roundRectPath(ctx, sx, sy, slotW, slotH, 3);
        ctx.fill(); ctx.stroke();
      }
      ctx.shadowBlur = 0;

      const canBuy = lv < 5 && this.meta.chips >= cost;
      const btnHov = pointer.x >= btn.x && pointer.x <= btn.x + btn.w && pointer.y >= btn.y && pointer.y <= btn.y + btn.h;
      ctx.fillStyle = lv >= 5 ? 'rgba(50, 50, 50, .45)' : canBuy ? (btnHov ? rgba(talent.color, .38) : rgba(talent.color, .22)) : 'rgba(30, 30, 30, .45)';
      ctx.strokeStyle = lv >= 5 ? '#555' : canBuy ? (btnHov ? '#ffffff' : talent.color) : '#666';
      ctx.lineWidth = (btnHov && canBuy) ? 2.5 : 1.4;
      ctx.shadowColor = talent.color; ctx.shadowBlur = (btnHov && canBuy) ? 16 : 6;
      roundRectPath(ctx, btn.x, btn.y, btn.w, btn.h, btn.h / 2);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = lv >= 5 ? '#888' : canBuy ? '#fff' : '#666';
      ctx.font = '800 12px "Segoe UI", sans-serif';
      ctx.fillText(lv >= 5 ? 'MAX' : `+ 💾${cost}`, btn.x + btn.w / 2, btn.y + btn.h / 2);
    });
    ctx.restore();
  }

  drawPause() {
    const rects = this.pauseButtons();
    const bw = 410, by = rects[0].y - 58, ye = rects[2].y + rects[2].h + 46;
    const bx = viewW / 2 - bw / 2, bh = ye - by;
    ctx.save();
    ctx.fillStyle = 'rgba(2, 6, 14, .74)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.strokeStyle = 'rgba(107, 245, 255, .28)'; ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#6bf5ff'; ctx.shadowColor = '#6bf5ff'; ctx.shadowBlur = 22;
    ctx.font = '900 27px "Segoe UI", sans-serif';
    ctx.fillText('NEON PAUSE', viewW / 2, by + 42);
    ctx.shadowBlur = 0;
    const labels = ['⚡ RESUME', '💾 SAVE & EXIT', '🔄 ABANDON RUN'];
    const cols = ['#6bf5ff', '#c7ff62', '#ff5d96'];
    rects.forEach((rect, i) => {
      const hov = pointer.x >= rect.x && pointer.x <= rect.x + rect.w && pointer.y >= rect.y && pointer.y <= rect.y + rect.h;
      ctx.fillStyle = rgba(cols[i], hov ? .22 : .1);
      ctx.strokeStyle = hov ? '#ffffff' : cols[i];
      ctx.lineWidth = hov ? 2.5 : 1.2;
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.fillStyle = hov ? '#e8fdff' : cols[i];
      ctx.font = '800 15px "Segoe UI", sans-serif';
      ctx.fillText(labels[i], viewW / 2, rect.y + rect.h / 2 + 1);
    });
    const last = rects[2];
    ctx.fillStyle = '#7895a4'; ctx.font = '600 12px "Segoe UI", sans-serif';
    ctx.fillText(`${this.waveLabel()} · ${fmtTime(this.time)} · LV ${this.level} · ${this.kills} KILLS`, viewW / 2, last.y + last.h + 26);
    ctx.restore();
  }

  drawUpgrade() {
    ctx.save();
    ctx.fillStyle = 'rgba(2, 5, 12, .82)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#c7ff62'; ctx.shadowColor = '#c7ff62'; ctx.shadowBlur = 20;
    ctx.font = '900 30px "Segoe UI", sans-serif';
    ctx.fillText('SYSTEM EVOLUTION', viewW / 2, viewH * .14);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#7694a4'; ctx.font = '600 12px "Segoe UI", sans-serif';
    ctx.fillText(`LEVEL ${this.level} // SELECT ONE AUGMENTATION`, viewW / 2, viewH * .2);

    const rects = this.cardRects();
    rects.forEach((rect, idx) => {
      const card = this.upgrades[idx];
      if (!card) return;
      const hover = pointer.x >= rect.x && pointer.x <= rect.x + rect.w && pointer.y >= rect.y && pointer.y <= rect.y + rect.h;
      ctx.save();
      ctx.translate(0, hover ? -8 : 0);
      ctx.fillStyle = hover ? 'rgba(16, 37, 50, .98)' : 'rgba(8, 18, 30, .96)';
      ctx.strokeStyle = hover ? card.accent : rgba(card.accent, .5);
      ctx.lineWidth = hover ? 2.5 : 1;
      ctx.shadowColor = card.accent; ctx.shadowBlur = hover ? 28 : 10;
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.shadowBlur = 0;

      ctx.textAlign = 'left';
      ctx.fillStyle = card.accent;
      ctx.font = '900 31px "Segoe UI", sans-serif';
      ctx.fillText(card.icon, rect.x + 24, rect.y + 52);
      ctx.textAlign = 'right';
      ctx.font = '800 12px "Segoe UI", sans-serif';
      ctx.fillStyle = '#7895a4';
      ctx.fillText(`0${idx + 1}`, rect.x + rect.w - 20, rect.y + 31);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ebfcff';
      ctx.font = '800 16px "Segoe UI", sans-serif';
      /* Cache wrapped lines per card+width — only re-measure on resize. */
      const wrapW = Math.round(rect.w - 44);
      if (card._wrapW !== wrapW) {
        card._wrapW = wrapW;
        card._title = this.wrap(card.title, wrapW, 16);
        card._desc = this.wrap(card.description, wrapW, 12);
      }
      const titleLines = card._title;
      titleLines.forEach((line, li) => ctx.fillText(line, rect.x + 22, rect.y + 103 + li * 23));
      ctx.fillStyle = '#82a0ae';
      ctx.font = '500 12px "Segoe UI", sans-serif';
      const descLines = card._desc;
      descLines.forEach((line, li) => ctx.fillText(line, rect.x + 22, rect.y + 166 + li * 21));
      ctx.fillStyle = hover ? card.accent : '#607987';
      ctx.font = '700 10px "Segoe UI", sans-serif';
      ctx.fillText('CLICK OR PRESS', rect.x + 22, rect.y + rect.h - 36);
      ctx.fillStyle = '#d7faff';
      ctx.font = '900 16px "Segoe UI", sans-serif';
      ctx.fillText(String(idx + 1), rect.x + 22, rect.y + rect.h - 17);
      ctx.restore();
    });

    const reroll = this.rerollButton();
    const rHov = pointer.x >= reroll.x && pointer.x <= reroll.x + reroll.w && pointer.y >= reroll.y && pointer.y <= reroll.y + reroll.h;
    ctx.fillStyle = this.rerollUsed ? 'rgba(50, 50, 50, .3)' : rHov ? 'rgba(255, 224, 109, .25)' : 'rgba(255, 224, 109, .12)';
    ctx.strokeStyle = this.rerollUsed ? '#444' : '#ffe06d';
    ctx.strokeRect(reroll.x, reroll.y, reroll.w, reroll.h);
    ctx.fillRect(reroll.x, reroll.y, reroll.w, reroll.h);
    ctx.fillStyle = this.rerollUsed ? '#666' : '#fff';
    ctx.font = '800 12px "Segoe UI", sans-serif';
    ctx.fillText(this.rerollUsed ? 'REROLL USED' : '🎬 WATCH AD TO REROLL', viewW / 2, reroll.y + reroll.h / 2 + 1);
    ctx.restore();
  }

  drawRevive() {
    ctx.save();
    ctx.fillStyle = 'rgba(18, 2, 8, .88)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff315d'; ctx.shadowColor = '#ff315d'; ctx.shadowBlur = 30;
    ctx.font = '900 38px "Segoe UI", sans-serif';
    ctx.fillText('CRITICAL CORE FAILURE', viewW / 2, viewH * .32);
    ctx.shadowBlur = 0;

    const rest = Math.ceil(Math.max(0, this.reviveTimer));
    ctx.fillStyle = '#ff8fa3'; ctx.font = '800 18px "Segoe UI", sans-serif';
    ctx.fillText(`SYSTEM SHUTDOWN IN: ${rest}S`, viewW / 2, viewH * .42);

    const btn = this.reviveModalButton();
    const hov = pointer.x >= btn.x && pointer.x <= btn.x + btn.w && pointer.y >= btn.y && pointer.y <= btn.y + btn.h;
    ctx.fillStyle = hov ? 'rgba(107, 245, 255, .3)' : 'rgba(107, 245, 255, .15)';
    ctx.strokeStyle = '#6bf5ff';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#6bf5ff'; ctx.shadowBlur = hov ? 30 : 15;
    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '900 15px "Segoe UI", sans-serif';
    ctx.fillText('🎬 WATCH AD TO REVIVE & EMP', viewW / 2, btn.y + btn.h / 2 + 1);

    ctx.fillStyle = '#777'; ctx.font = '600 11px "Segoe UI", sans-serif';
    ctx.fillText('[ GIVE UP ]', viewW / 2, viewH * .68 + 18);
    ctx.restore();
  }

  drawResult() {
    ctx.save();
    ctx.fillStyle = 'rgba(2, 5, 12, .88)'; ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const victory = this.resultVictory;
    const color = victory ? '#c7ff62' : '#ff5d96';
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 28;
    ctx.font = `900 ${Math.min(54, viewW * .06)}px "Segoe UI", sans-serif`;
    ctx.fillText(victory ? 'CORE PURIFIED' : 'SIGNAL LOST', viewW / 2, viewH * .26);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#91aab7'; ctx.font = '600 12px "Segoe UI", sans-serif';
    ctx.fillText(victory ? 'ALL THREAT SIGNALS NEUTRALIZED // MISSION ACCOMPLISHED' : 'THE PURIFIER WAS OVERRIDDEN BY HOSTILE SIGNAL', viewW / 2, viewH * .34);

    ctx.fillStyle = '#e6fbff'; ctx.font = '800 18px "Segoe UI", sans-serif';
    ctx.fillText(`${String(this.kills).padStart(4, '0')} KILLS   ·   ${fmtTime(this.time)} SURVIVED   ·   LV ${this.level}`, viewW / 2, viewH * .43);
    ctx.fillStyle = '#ffe06d'; ctx.font = '800 16px "Segoe UI", sans-serif';
    ctx.fillText(`REWARD: 💾 +${this.chipsRun} DATA CHIPS`, viewW / 2, viewH * .5);

    const doubleBtn = this.doubleButton();
    const dHov = pointer.x >= doubleBtn.x && pointer.x <= doubleBtn.x + doubleBtn.w && pointer.y >= doubleBtn.y && pointer.y <= doubleBtn.y + doubleBtn.h;
    ctx.fillStyle = this.doubleClaimed ? 'rgba(50,50,50,.3)' : dHov ? 'rgba(255, 224, 109, .3)' : 'rgba(255, 224, 109, .15)';
    ctx.strokeStyle = this.doubleClaimed ? '#555' : '#ffe06d';
    ctx.strokeRect(doubleBtn.x, doubleBtn.y, doubleBtn.w, doubleBtn.h);
    ctx.fillRect(doubleBtn.x, doubleBtn.y, doubleBtn.w, doubleBtn.h);
    ctx.fillStyle = this.doubleClaimed ? '#777' : '#fff';
    ctx.font = '800 13px "Segoe UI", sans-serif';
    ctx.fillText(this.doubleClaimed ? '✓ DOUBLED' : '🎬 DOUBLE CHIPS (x2)', viewW / 2, doubleBtn.y + doubleBtn.h / 2 + 1);

    const button = this.resultButton();
    const hover = pointer.x >= button.x && pointer.x <= button.x + button.w && pointer.y >= button.y && pointer.y <= button.y + button.h;
    ctx.fillStyle = hover ? rgba(color, .25) : rgba(color, .1);
    ctx.strokeStyle = color; ctx.lineWidth = hover ? 2.5 : 1.5; ctx.shadowColor = color; ctx.shadowBlur = hover ? 28 : 14;
    ctx.fillRect(button.x, button.y, button.w, button.h); ctx.strokeRect(button.x, button.y, button.w, button.h);
    ctx.shadowBlur = 0; ctx.fillStyle = '#efffff'; ctx.font = '800 14px "Segoe UI", sans-serif';
    ctx.fillText('RETURN TO MENU', viewW / 2, button.y + button.h / 2 + 1);
    ctx.restore();
  }

  wrap(text, width, fontSize) {
    ctx.font = `${fontSize}px "Segoe UI", sans-serif`;
    const lines = [];
    let line = '';
    for (const char of text) {
      const candidate = line + char;
      if (ctx.measureText(candidate).width > width && line) { lines.push(line); line = char; } else line = candidate;
    }
    if (line) lines.push(line);
    return lines;
  }
}

engine = new GameEngine();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (engine.state === 'playing') engine.pause();
    engine.audio.suspend();
  } else {
    engine.audio.resume();
  }
});
</script>
