<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Purifier: Protocol Zero</title>
<style>
:root {
  color-scheme: dark;
  --bg: #060910;
  --panel: rgba(8, 14, 26, .88);
  --line: rgba(138, 221, 255, .2);
  --cyan: #64eaff;
  --pink: #ff4e9b;
  --lime: #c7ff62;
  --amber: #ffcc6e;
  --ink: #d8f4ff;
  --muted: #70889b;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--ink); }
#game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
#veil {
  position: fixed; inset: 0; pointer-events: none; opacity: .2; mix-blend-mode: screen;
  background: repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(112, 226, 255, .045) 4px, transparent 5px), radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,.55) 100%);
}
#badge {
  position: fixed; left: 18px; bottom: 14px; z-index: 3; pointer-events: none;
  font-size: 10px; letter-spacing: .22em; color: rgba(180, 227, 244, .52); text-transform: uppercase;
}
@media (max-width: 700px) {
  #badge { display: none; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="veil"></div>
<div id="badge">CYPHER DIVISION // PROTOCOL ZERO // v0.9.7</div>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let viewW = 1280;
let viewH = 720;
let dpr = Math.min(window.devicePixelRatio || 1, 2);
const TAU = Math.PI * 2;
const rand = (min, max) => Math.random() * (max - min) + min;
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angleTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const fmtTime = seconds => {
  const total = Math.max(0, Math.floor(seconds));
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
};
const rgba = (hex, alpha) => {
  const value = hex.replace('#', '');
  const n = parseInt(value.length === 3 ? value.split('').map(x => x + x).join('') : value, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
};

function resize() {
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width = `${viewW}px`;
  canvas.style.height = `${viewH}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

class AudioController {
  constructor() {
    this.context = null;
    this.master = null;
    this.enabled = true;
  }
  boot() {
    if (this.context) {
      if (this.context.state === 'suspended') this.context.resume();
      return;
    }
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    this.context = new AudioContextClass();
    this.master = this.context.createGain();
    this.master.gain.value = .16;
    this.master.connect(this.context.destination);
  }
  tone(frequency, duration, type = 'sine', volume = .08, slide = 1) {
    if (!this.enabled || !this.context || !this.master) return;
    const now = this.context.currentTime;
    const osc = this.context.createOscillator();
    const gain = this.context.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, frequency), now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, frequency * slide), now + duration);
    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + .008);
    gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
    osc.connect(gain).connect(this.master);
    osc.start(now);
    osc.stop(now + duration + .02);
  }
  shot() { this.tone(350, .055, 'square', .045, .42); }
  hit() { this.tone(180, .08, 'triangle', .045, 1.7); }
  dash() { this.tone(180, .18, 'sawtooth', .075, 3.2); }
  blade() { this.tone(640, .045, 'sine', .028, .74); }
  grenade() { this.tone(90, .18, 'sawtooth', .06, .45); }
  explosion(critical = false) {
    this.tone(critical ? 110 : 80, critical ? .28 : .18, 'sawtooth', critical ? .13 : .075, .18);
    this.noise(critical ? .25 : .14, critical ? .12 : .065);
  }
  noise(duration, volume) {
    if (!this.enabled || !this.context || !this.master) return;
    const length = Math.floor(this.context.sampleRate * duration);
    const buffer = this.context.createBuffer(1, length, this.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
    const source = this.context.createBufferSource();
    const filter = this.context.createBiquadFilter();
    const gain = this.context.createGain();
    filter.type = 'lowpass';
    filter.frequency.value = 1600;
    gain.gain.value = volume;
    source.buffer = buffer;
    source.connect(filter).connect(gain).connect(this.master);
    source.start();
  }
  levelUp() {
    [0, 4, 7, 12].forEach((step, index) => {
      setTimeout(() => this.tone(330 * Math.pow(2, step / 12), .28, 'sine', .07, 1.04), index * 75);
    });
  }
  click() { this.tone(480, .06, 'square', .04, 1.5); }
}

class ParticleSystem {
  constructor() {
    this.items = [];
    this.shockwaves = [];
  }
  emit(x, y, color, count = 8, speed = 100, size = 2.5, life = .7) {
    for (let i = 0; i < count; i++) {
      const angle = rand(0, TAU);
      const power = speed * rand(.35, 1);
      this.items.push({ x, y, vx: Math.cos(angle) * power, vy: Math.sin(angle) * power, size: rand(size * .45, size), color, life: rand(life * .55, life), maxLife: life, drag: rand(.91, .97), gravity: rand(-8, 34) });
    }
  }
  sparks(x, y, color, count = 5) { this.emit(x, y, color, count, 180, 2, .42); }
  burst(x, y, colors, count = 10, power = 150) {
    for (let i = 0; i < count; i++) this.emit(x, y, colors[i % colors.length], 1, power, rand(2, 5), rand(.45, .9));
  }
  shock(x, y, color, radius = 30, maxRadius = 180, life = .38, damage = 0) {
    this.shockwaves.push({ x, y, color, radius, maxRadius, life, maxLife: life, damage, hit: new Set() });
  }
  update(dt) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const p = this.items[i];
      p.life -= dt;
      if (p.life <= 0) { this.items[i] = this.items[this.items.length - 1]; this.items.pop(); continue; }
      p.vx *= Math.pow(p.drag, dt * 60);
      p.vy = p.vy * Math.pow(p.drag, dt * 60) + p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = this.shockwaves.length - 1; i >= 0; i--) {
      const s = this.shockwaves[i];
      s.life -= dt;
      s.radius = lerp(s.radius, s.maxRadius, 1 - Math.pow(.001, dt / s.maxLife));
      if (s.life <= 0) { this.shockwaves[i] = this.shockwaves[this.shockwaves.length - 1]; this.shockwaves.pop(); }
    }
  }
  draw() {
    for (const p of this.items) {
      const alpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (.5 + alpha * .5), 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    for (const s of this.shockwaves) {
      const alpha = clamp(s.life / s.maxLife, 0, 1);
      ctx.globalAlpha = alpha * .82;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 3 + alpha * 5;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = alpha * .18;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

class FloatingText {
  constructor(x, y, text, color, size = 14, emphasis = false) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.size = size;
    this.life = 1;
    this.maxLife = 1;
    this.emphasis = emphasis;
    this.vy = -34;
  }
  update(dt) { this.life -= dt; this.y += this.vy * dt; this.vy *= .98; }
  draw() {
    const alpha = clamp(this.life / this.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.font = `${this.emphasis ? 800 : 700} ${this.size}px "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.emphasis ? 18 : 10;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

class Gem {
  constructor(x, y, value = 1) {
    this.x = x;
    this.y = y;
    this.vx = rand(-20, 20);
    this.vy = rand(-20, 20);
    this.value = value;
    this.r = value > 3 ? 7 : 5;
    this.spin = rand(0, TAU);
  }
  update(dt, player) {
    this.spin += dt * 4;
    this.vx *= Math.pow(.88, dt * 60);
    this.vy *= Math.pow(.88, dt * 60);
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const d = Math.hypot(dx, dy);
    if (d < player.magnet) {
      const power = d < 40 ? 620 : 240 + (1 - d / player.magnet) * 400;
      this.vx += dx / Math.max(d, 1) * power * dt;
      this.vy += dy / Math.max(d, 1) * power * dt;
    }
    return d < 20;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.spin);
    ctx.shadowColor = '#b7fffd';
    ctx.shadowBlur = 16;
    ctx.fillStyle = this.value > 3 ? '#d6ff77' : '#6feaff';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -this.r * 1.35);
    ctx.lineTo(this.r, 0);
    ctx.lineTo(0, this.r * 1.35);
    ctx.lineTo(-this.r, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, angle, damage, pierce, critical = false) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * 680;
    this.vy = Math.sin(angle) * 680;
    this.r = critical ? 7 : 4;
    this.damage = damage;
    this.pierce = pierce;
    this.critical = critical;
    this.life = 1.5;
    this.hit = new Set();
    this.color = critical ? '#ffe06d' : '#6bf5ff';
  }
  update(dt) {
    this.life -= dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
  draw() {
    ctx.save();
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.r;
    ctx.lineCap = 'round';
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(this.x - this.vx * .018, this.y - this.vy * .018);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
    ctx.restore();
  }
}

class Grenade {
  constructor(x, y, targetX, targetY, damage, radius) {
    this.x = x;
    this.y = y;
    this.startX = x;
    this.startY = y;
    this.targetX = targetX;
    this.targetY = targetY;
    this.progress = 0;
    this.damage = damage;
    this.radius = radius;
    this.life = .68;
  }
  update(dt) {
    this.progress += dt / .68;
    this.life -= dt;
    const t = clamp(this.progress, 0, 1);
    this.x = lerp(this.startX, this.targetX, t);
    this.y = lerp(this.startY, this.targetY, t) - Math.sin(t * Math.PI) * 90;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.progress * TAU * 2);
    ctx.shadowColor = '#ff65b0';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ff5cab';
    ctx.strokeStyle = '#ffd6ed';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(7, 0);
    ctx.lineTo(0, 8);
    ctx.lineTo(-7, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

class Enemy {
  constructor(type, x, y, engine) {
    this.type = type;
    this.x = x;
    this.y = y;
    this.engine = engine;
    this.phase = rand(0, TAU);
    this.hitFlash = 0;
    this.attackTimer = rand(1, 2);
    this.dead = false;
    this.vx = 0;
    this.vy = 0;
    if (type === 'crawler') {
      this.r = 13;
      this.hp = 30 + engine.time * .18;
      this.maxHp = this.hp;
      this.speed = rand(62, 92) + engine.time * .09;
      this.color = '#ff4f9a';
      this.xp = 1;
      this.damage = 7;
    } else if (type === 'enforcer') {
      this.r = 24;
      this.hp = 240 + (engine.time - 60) * 2.8;
      this.maxHp = this.hp;
      this.speed = rand(31, 45);
      this.color = '#ffad62';
      this.xp = 4;
      this.damage = 16;
      this.shield = 90;
      this.maxShield = 90;
    } else {
      this.r = 68;
      this.hp = 17500;
      this.maxHp = this.hp;
      this.speed = 22;
      this.color = '#bd72ff';
      this.xp = 60;
      this.damage = 28;
      this.boss = true;
      this.laserTimer = 5;
      this.ringTimer = 2.4;
      this.summonTimer = 7;
    }
  }
  update(dt) {
    if (this.dead) return;
    this.hitFlash = Math.max(0, this.hitFlash - dt * 5);
    const player = this.engine.player;
    const angle = Math.atan2(player.y - this.y, player.x - this.x);
    const distance = Math.hypot(player.x - this.x, player.y - this.y);
    const wobble = Math.sin(this.phase + this.engine.time * 4) * (this.type === 'crawler' ? .12 : .04);
    const desiredX = Math.cos(angle + wobble) * this.speed;
    const desiredY = Math.sin(angle + wobble) * this.speed;
    this.vx = lerp(this.vx, desiredX, dt * 3.2);
    this.vy = lerp(this.vy, desiredY, dt * 3.2);
    if (this.boss) {
      this.vx = lerp(this.vx, desiredX, dt * 1.3);
      this.vy = lerp(this.vy, desiredY, dt * 1.3);
      this.ringTimer -= dt;
      this.laserTimer -= dt;
      this.summonTimer -= dt;
      if (this.ringTimer <= 0) {
        this.ringTimer = 3.2;
        this.engine.bossRing(this);
      }
      if (this.laserTimer <= 0) {
        this.laserTimer = 6.8;
        this.engine.bossLaser(this);
      }
      if (this.summonTimer <= 0) {
        this.summonTimer = 8;
        for (let i = 0; i < 5; i++) this.engine.spawnEnemy('enforcer', this.x + rand(-90, 90), this.y + rand(-90, 90));
      }
    }
    if (distance > this.r + player.r * .75) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
    } else if (this.attackTimer <= 0 && player.invulnerable <= 0) {
      this.attackTimer = this.boss ? 1 : .8;
      player.damage(this.damage);
      this.engine.audio.hit();
    } else {
      this.attackTimer -= dt;
    }
  }
  takeDamage(amount, critical = false, knockX = 0, knockY = 0) {
    if (this.dead) return false;
    let actual = amount;
    if (this.shield > 0) {
      const shieldDamage = Math.min(this.shield, actual * .82);
      this.shield -= shieldDamage;
      actual -= shieldDamage * .55;
    }
    this.hp -= actual;
    this.hitFlash = 1;
    this.x += knockX;
    this.y += knockY;
    this.engine.floating.push(new FloatingText(this.x, this.y - this.r - 8, `${critical ? 'CRIT ' : ''}${Math.round(actual)}`, critical ? '#ffe36b' : '#c9faff', critical ? 22 : 13, critical));
    if (critical) {
      this.engine.shake = Math.max(this.engine.shake, 11);
      this.engine.particles.burst(this.x, this.y, ['#ffe36b', '#ff8f62', '#fff'], 8, 260);
      this.engine.audio.explosion(true);
    } else {
      this.engine.particles.sparks(this.x, this.y, this.color, 3);
      this.engine.audio.hit();
    }
    if (this.hp <= 0) this.die();
    return true;
  }
  die() {
    if (this.dead) return;
    this.dead = true;
    const count = this.boss ? 55 : rand(8, 13);
    this.engine.particles.burst(this.x, this.y, this.boss ? ['#bd72ff', '#ff5cab', '#6bf5ff', '#fff'] : [this.color, '#6bf5ff', '#fff'], count, this.boss ? 420 : 190);
    this.engine.particles.shock(this.x, this.y, this.color, this.r, this.boss ? 360 : 70, this.boss ? .8 : .24);
    this.engine.shake = Math.max(this.engine.shake, this.boss ? 28 : 4);
    this.engine.audio.explosion(this.boss);
    this.engine.kills++;
    this.engine.gems.push(new Gem(this.x, this.y, this.xp));
    if (this.boss) this.engine.win();
  }
  draw() {
    const pulse = 1 + Math.sin(this.phase + this.engine.time * 6) * .08;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.phase + this.engine.time * (this.boss ? .25 : .7));
    ctx.globalAlpha = this.hitFlash > 0 ? 1 : .95;
    ctx.shadowColor = this.hitFlash > 0 ? '#fff' : this.color;
    ctx.shadowBlur = this.boss ? 32 : 17;
    ctx.strokeStyle = this.hitFlash > 0 ? '#fff' : this.color;
    ctx.fillStyle = this.hitFlash > 0 ? '#fff' : rgba(this.color, .17);
    ctx.lineWidth = this.boss ? 4 : 2;
    if (this.type === 'crawler') {
      ctx.beginPath();
      ctx.moveTo(0, -this.r * pulse);
      ctx.lineTo(this.r * .8, this.r * .6);
      ctx.lineTo(0, this.r * .25);
      ctx.lineTo(-this.r * .8, this.r * .6);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-this.r * .9, this.r * .2); ctx.lineTo(-this.r * 1.35, this.r * .6); ctx.moveTo(this.r * .9, this.r * .2); ctx.lineTo(this.r * 1.35, this.r * .6); ctx.stroke();
    } else if (this.type === 'enforcer') {
      ctx.beginPath();
      ctx.rect(-this.r * .75, -this.r * .75, this.r * 1.5, this.r * 1.5);
      ctx.fill(); ctx.stroke();
      ctx.rotate(Math.PI / 4);
      ctx.strokeStyle = rgba(this.color, .7);
      ctx.lineWidth = 3;
      ctx.strokeRect(-this.r * .55, -this.r * .55, this.r * 1.1, this.r * 1.1);
      if (this.shield > 0) {
        ctx.globalAlpha = .35 + this.shield / this.maxShield * .4;
        ctx.strokeStyle = '#6feaff';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, this.r * 1.18, 0, TAU); ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.arc(0, 0, this.r * pulse, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#ff5cab';
      ctx.lineWidth = 4;
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 4); ctx.strokeRect(-this.r * .72, -this.r * .12, this.r * 1.44, this.r * .24); }
      ctx.fillStyle = '#ff5cab';
      ctx.beginPath(); ctx.arc(0, 0, 18 + Math.sin(this.engine.time * 8) * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0b0d17';
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    if (!this.boss) {
      const width = this.r * 2.2;
      const hpRatio = clamp(this.hp / this.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0, 0, 0, .55)';
      ctx.fillRect(this.x - width / 2, this.y - this.r - 13, width, 3);
      ctx.fillStyle = this.type === 'enforcer' ? '#ffad62' : '#ff4f9a';
      ctx.fillRect(this.x - width / 2, this.y - this.r - 13, width * hpRatio, 3);
    }
  }
}

class Weapon {
  constructor(kind, engine) {
    this.kind = kind;
    this.engine = engine;
    this.level = 1;
    this.cooldown = 0;
    this.angle = rand(0, TAU);
  }
  get label() {
    return this.kind === 'plasma' ? '等离子脉冲枪' : this.kind === 'blade' ? '环形护体光刃' : '电磁散射雷';
  }
  get color() { return this.kind === 'plasma' ? '#6bf5ff' : this.kind === 'blade' ? '#c7ff62' : '#ff5cab'; }
  update(dt) {
    const p = this.engine.player;
    this.cooldown -= dt;
    if (this.kind === 'plasma') {
      const interval = Math.max(.12, .4 - this.level * .035);
      if (this.cooldown <= 0) {
        this.cooldown = interval;
        const target = this.engine.nearestEnemy(p.x, p.y);
        if (target) {
          const critical = Math.random() < p.crit;
          const damage = (36 + this.level * 17) * (critical ? 2.1 : 1);
          this.engine.bullets.push(new Bullet(p.x, p.y, angleTo(p, target), damage, 1 + Math.floor(this.level / 3), critical));
          this.engine.audio.shot();
          this.engine.particles.sparks(p.x, p.y, '#6bf5ff', 3);
          p.recoil = 1;
          p.muzzleFade = 1;
        }
      }
    } else if (this.kind === 'blade') {
      this.angle += dt * (1.5 + this.level * .05);
      const count = clamp(this.level + 1, 2, 6);
      const orbit = 45 + this.level * 2;
      for (let i = 0; i < count; i++) {
        const a = this.angle + i * TAU / count;
        const x = p.x + Math.cos(a) * orbit;
        const y = p.y + Math.sin(a) * orbit;
        for (const enemy of this.engine.enemies) {
          if (enemy.dead) continue;
          const d = Math.hypot(enemy.x - x, enemy.y - y);
          if (d < enemy.r + 12 && Math.random() < dt * 10) {
            const critical = Math.random() < p.crit * .7;
            enemy.takeDamage(22 + this.level * 12 * (critical ? 1.9 : 1), critical, Math.cos(a) * 3, Math.sin(a) * 3);
            this.engine.audio.blade();
          }
        }
      }
    } else if (this.kind === 'grenade') {
      const interval = Math.max(1.4, 4.2 - this.level * .22);
      if (this.cooldown <= 0) {
        this.cooldown = interval;
        const target = this.engine.denseTarget();
        if (target) {
          this.engine.grenades.push(new Grenade(p.x, p.y, target.x, target.y, 90 + this.level * 45, 105 + this.level * 13));
          this.engine.audio.grenade();
        }
      }
    }
  }
  draw() {
    if (this.kind !== 'blade') return;
    const p = this.engine.player;
    const count = clamp(this.level + 1, 2, 6);
    const orbit = 45 + this.level * 2;
    for (let i = 0; i < count; i++) {
      const a = this.angle + i * TAU / count;
      const x = p.x + Math.cos(a) * orbit;
      const y = p.y + Math.sin(a) * orbit;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a + Math.PI / 4);
      ctx.shadowColor = '#c7ff62';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#c7ff62';
      ctx.strokeStyle = '#f5ffd6';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -16); ctx.lineTo(5, 0); ctx.lineTo(0, 16); ctx.lineTo(-5, 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
}

class Player {
  constructor(engine) {
    this.engine = engine;
    this.x = 0;
    this.y = 0;
    this.vx = 0;
    this.vy = 0;
    this.r = 17;
    this.hp = 100;
    this.maxHp = 100;
    this.speed = 230;
    this.magnet = 115;
    this.crit = .08;
    this.dashCooldown = 0;
    this.dashMax = 3;
    this.invulnerable = 0;
    this.trailTimer = 0;
    this.trails = [];
    this.heading = 0;
    this.prevHeading = 0;
    this.tilt = 0;
    this.recoil = 0;
    this.muzzleFade = 0;
    this.thrustTimer = 0;
    this.weapons = [new Weapon('plasma', engine)];
  }
  update(dt) {
    let dx = 0;
    let dy = 0;
    if (input.has('w') || input.has('arrowup')) dy -= 1;
    if (input.has('s') || input.has('arrowdown')) dy += 1;
    if (input.has('a') || input.has('arrowleft')) dx -= 1;
    if (input.has('d') || input.has('arrowright')) dx += 1;
    const length = Math.hypot(dx, dy) || 1;
    const targetX = (dx || dy) ? dx / length * this.speed : 0;
    const targetY = (dx || dy) ? dy / length * this.speed : 0;
    const blend = Math.min(1, dt * 16);
    this.vx = this.vx + (targetX - this.vx) * blend;
    this.vy = this.vy + (targetY - this.vy) * blend;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if ((dx || dy) && (Math.abs(this.vx) > 8 || Math.abs(this.vy) > 8)) {
      this.trailTimer -= dt;
      if (this.trailTimer <= 0) {
        this.trailTimer = .045;
        this.trails.push({ x: this.x, y: this.y, life: .35 });
      }
    }
    for (let i = this.trails.length - 1; i >= 0; i--) {
      this.trails[i].life -= dt;
      if (this.trails[i].life <= 0) this.trails.splice(i, 1);
    }
    this.dashCooldown = Math.max(0, this.dashCooldown - dt);
    this.invulnerable = Math.max(0, this.invulnerable - dt);
    this.recoil = Math.max(0, this.recoil - dt * 7);
    this.muzzleFade = Math.max(0, this.muzzleFade - dt * 9);
    this.updateHeading(dt);
    this.emitThrust(dt);
    for (const weapon of this.weapons) weapon.update(dt);
  }
  updateHeading(dt) {
    const target = this.engine.nearestEnemy(this.x, this.y);
    let targetHeading;
    if (target) {
      targetHeading = Math.atan2(target.y - this.y, target.x - this.x);
    } else if (Math.abs(this.vx) + Math.abs(this.vy) > 1) {
      targetHeading = Math.atan2(this.vy, this.vx);
    } else {
      targetHeading = this.heading;
    }
    let diff = targetHeading - this.heading;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    const turnRate = (this.heading - this.prevHeading) / Math.max(dt, 1e-5);
    this.heading += diff * Math.min(1, dt * 10);
    this.tilt = this.tilt + (clamp(turnRate * .42, -.34, .34) - this.tilt) * Math.min(1, dt * 7);
    this.prevHeading = this.heading;
  }
  emitThrust(dt) {
    const speed = Math.hypot(this.vx, this.vy);
    const speedN = clamp(speed / this.speed, 0, 1);
    this.thrustTimer -= dt;
    if (this.thrustTimer <= 0) {
      this.thrustTimer = .014;
      const cos = Math.cos(this.heading);
      const sin = Math.sin(this.heading);
      const power = 40 + speedN * 120;
      for (let s = -6.5; s <= 6.5; s += 13) {
        const ox = this.x - cos * 11 + cos * 0 - sin * s;
        const oy = this.y - sin * 11 + sin * 0 + cos * s;
        const back = .5 + speedN * .5;
        this.engine.particles.emit(ox, oy, speedN > .35 ? '#8ff0ff' : '#6fa8ff', 1, power, 1.6, .32 + speedN * .2);
        const p = this.engine.particles.items[this.engine.particles.items.length - 1];
        p.vx -= this.vx * back * .4;
        p.vy -= this.vy * back * .4;
        p.gravity = 0;
      }
    }
  }
  dash() {
    if (this.dashCooldown > 0 || this.engine.state !== 'playing') return;
    let dx = 0;
    let dy = 0;
    if (input.has('a') || input.has('arrowleft')) dx -= 1;
    if (input.has('d') || input.has('arrowright')) dx += 1;
    if (input.has('w') || input.has('arrowup')) dy -= 1;
    if (input.has('s') || input.has('arrowdown')) dy += 1;
    if (!dx && !dy) dx = 1;
    const length = Math.hypot(dx, dy) || 1;
    const startX = this.x;
    const startY = this.y;
    this.x += dx / length * 165;
    this.y += dy / length * 165;
    this.dashCooldown = this.dashMax;
    this.invulnerable = .38;
    this.engine.shake = Math.max(this.engine.shake, 8);
    this.engine.particles.burst(startX, startY, ['#6bf5ff', '#fff'], 16, 220);
    this.engine.audio.dash();
  }
  damage(amount) {
    if (this.invulnerable > 0) return;
    this.hp -= amount;
    this.engine.shake = Math.max(this.engine.shake, 9);
    this.engine.particles.burst(this.x, this.y, ['#ff4f9a', '#fff'], 8, 170);
    this.engine.floating.push(new FloatingText(this.x, this.y - 28, `-${Math.round(amount)}`, '#ff709f', 18, true));
    if (this.hp <= 0) this.engine.lose();
  }
  addWeapon(kind) {
    const weapon = new Weapon(kind, this.engine);
    this.weapons.push(weapon);
    this.engine.particles.burst(this.x, this.y, [weapon.color, '#fff'], 18, 180);
  }
  upgradeWeapon(kind) {
    const weapon = this.weapons.find(item => item.kind === kind);
    if (weapon) weapon.level++;
    else this.addWeapon(kind);
  }
  draw() {
    for (const trail of this.trails) {
      const alpha = clamp(trail.life / .35, 0, 1) * .27;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#6bf5ff';
      ctx.shadowColor = '#6bf5ff';
      ctx.shadowBlur = 22;
      ctx.beginPath(); ctx.arc(trail.x, trail.y, this.r * (trail.life + .3), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const flicker = this.invulnerable > 0 && Math.floor(this.engine.time * 30) % 2 === 0;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.heading);
    ctx.transform(1, 0, this.tilt, 1, 0, 0);
    ctx.globalAlpha = flicker ? .45 : 1;

    // ---- ambient halo (soft underglow around the whole craft) ----
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.shadowColor = '#37d6ff';
    ctx.shadowBlur = 46;
    ctx.fillStyle = 'rgba(55, 190, 255, .12)';
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
    ctx.restore();

    const speed = Math.hypot(this.vx, this.vy);
    const speedN = clamp(speed / this.speed, 0, 1);
    const t = performance.now() / 1000;

    // ---- plasma thrusters (behind, along -X) ----
    const flameLen = 11 + speedN * 21 + Math.sin(t * 42) * 2.5;
    const flameW = 3 + Math.sin(t * 31) * 1;
    for (let s = 0, i = 0; s < 2; s++, i++) {
      const ly = i === 0 ? -4.6 : 4.6;
      const len = flameLen * (0.82 + Math.random() * .36);
      const grad = ctx.createLinearGradient(-8, ly, -8 - len, ly);
      grad.addColorStop(0, 'rgba(170,235,255,.96)');
      grad.addColorStop(.4, 'rgba(130,140,255,.65)');
      grad.addColorStop(1, 'rgba(90,220,255,0)');
      ctx.shadowColor = '#7cc8ff';
      ctx.shadowBlur = 20;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-7, ly - flameW);
      ctx.lineTo(-7 - len, ly);
      ctx.lineTo(-7, ly + flameW);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // ---- forward-swept wings (upper/lower symmetric) ----
    const wingGrad = ctx.createLinearGradient(-14, 0, 18, 0);
    wingGrad.addColorStop(0, '#123a4e');
    wingGrad.addColorStop(.55, '#145e78');
    wingGrad.addColorStop(1, '#0d8ab5');
    for (let side = -1; side <= 1; side += 2) {
      const y = side;
      ctx.shadowColor = '#2fd0ff';
      ctx.shadowBlur = 12;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      // wing outer plating
      ctx.fillStyle = wingGrad;
      ctx.strokeStyle = '#2c7ba0';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-3, 3.4 * y);
      ctx.lineTo(13, 19 * y);
      ctx.lineTo(-3, 20 * y);
      ctx.lineTo(-16, 6 * y);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // wing inner highlight
      ctx.strokeStyle = '#bdfbff';
      ctx.lineWidth = 1.2;
      ctx.shadowColor = '#6bf5ff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(-3, 3.4 * y);
      ctx.lineTo(13, 19 * y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-16, 6 * y);
      ctx.lineTo(-3, 20 * y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // ---- wingtip plasma cannons (with recoil) ----
    for (let side = -1; side <= 1; side += 2) {
      const y = side;
      const cx = 13 - this.recoil * 5;
      const cy = 19 * y;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.atan2(10 * y, 28) * y);
      ctx.shadowColor = '#37d6ff';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#0b2f42';
      ctx.strokeStyle = '#4fd9ff';
      ctx.lineWidth = 1.3;
      ctx.fillRect(-3, -2.4, 15, 4.8);
      ctx.strokeRect(-3, -2.4, 15, 4.8);
      ctx.fillStyle = '#9ff2ff';
      ctx.fillRect(10, -1.2, 3, 2.4);
      // muzzle flash
      if (this.muzzleFade > 0) {
        ctx.globalAlpha = this.muzzleFade;
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#9ff2ff';
        ctx.shadowBlur = 18;
        ctx.beginPath(); ctx.arc(14, 0, 2.6 + this.muzzleFade * 3, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }

    // ---- fuselage / hull ----
    const hullGrad = ctx.createLinearGradient(-20, -8, 30, 0);
    hullGrad.addColorStop(0, '#0c2230');
    hullGrad.addColorStop(.55, '#185a72');
    hullGrad.addColorStop(1, '#2ea5cf');
    ctx.shadowColor = '#0b4054';
    ctx.shadowBlur = 18;
    ctx.lineJoin = 'round';
    const outline = () => {
      ctx.beginPath();
      ctx.moveTo(31, 0);
      ctx.lineTo(7, -7);
      ctx.lineTo(-18, -4.5);
      ctx.lineTo(-22, 0);
      ctx.lineTo(-18, 4.5);
      ctx.lineTo(7, 7);
      ctx.closePath();
    };
    // outer armor plate (dark, thicker)
    ctx.fillStyle = hullGrad;
    ctx.strokeStyle = '#2a6f8a';
    ctx.lineWidth = 6;
    outline(); ctx.fill(); ctx.stroke();
    // inner glowing rim
    ctx.strokeStyle = '#c6fdff';
    ctx.lineWidth = 1.4;
    ctx.shadowColor = '#6bf5ff';
    ctx.shadowBlur = 16;
    outline(); ctx.stroke();
    // center spine line
    ctx.strokeStyle = 'rgba(189,251,255,.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(9, 0); ctx.stroke();
    // cockpit canopy
    ctx.fillStyle = 'rgba(120, 240, 255, .4)';
    ctx.strokeStyle = '#dffdff';
    ctx.lineWidth = 1;
    ctx.shadowColor = '#8ff0ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(5, -2.4);
    ctx.lineTo(22, 0);
    ctx.lineTo(5, 2.4);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // ---- reactor core (breathing pulse) ----
    const pulse = .6 + .4 * Math.sin(t * 2.6);
    const coreR = 5.2 + pulse * 1.8;
    // outer ring
    ctx.shadowColor = '#ff4ecb';
    ctx.shadowBlur = 20;
    ctx.strokeStyle = `rgba(255, 88, 200, ${.6 + pulse * .35})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, coreR + 3, 0, TAU); ctx.stroke();
    // rotating segmented ring
    ctx.strokeStyle = `rgba(120, 230, 255, ${.55 + pulse * .3})`;
    ctx.lineWidth = 1.6;
    ctx.shadowColor = '#37d6ff';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(0, 0, coreR + 1.4, t * 2, t * 2 + Math.PI * (1.2 + pulse * .5));
    ctx.stroke();
    // fiery nucleus
    ctx.fillStyle = `rgba(255, 255, 255, ${.85 + pulse * .15})`;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(0, 0, coreR * .72, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(80, 235, 255, ${.6 + pulse * .3})`;
    ctx.beginPath(); ctx.arc(0, 0, coreR * .45, 0, TAU); ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

const input = new Set();
const pointer = { x: 0, y: 0, down: false, moved: false };
window.addEventListener('keydown', event => {
  const key = event.key.toLowerCase();
  input.add(key);
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) event.preventDefault();
  if ((key === 'escape' || key === 'p') && !event.repeat) engine.togglePause();
  if (key === ' ' && !event.repeat) engine.player.dash();
  if (engine.state === 'upgrade' && ['1', '2', '3'].includes(key)) engine.chooseUpgrade(Number(key) - 1);
  if (key === 'enter' && engine.state === 'menu') engine.start();
  if (key === 'enter' && engine.state === 'result') engine.start();
});
window.addEventListener('keyup', event => input.delete(event.key.toLowerCase()));
canvas.addEventListener('pointermove', event => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = event.clientX - rect.left;
  pointer.y = event.clientY - rect.top;
  pointer.moved = true;
});
canvas.addEventListener('pointerdown', event => {
  pointer.down = true;
  engine.audio.boot();
  const rect = canvas.getBoundingClientRect();
  pointer.x = event.clientX - rect.left;
  pointer.y = event.clientY - rect.top;
  engine.click(pointer.x, pointer.y);
});
window.addEventListener('pointerup', () => pointer.down = false);

class GameEngine {
  constructor() {
    this.audio = new AudioController();
    this.particles = new ParticleSystem();
    this.state = 'menu';
    this.time = 0;
    this.kills = 0;
    this.level = 1;
    this.xp = 0;
    this.xpNext = 12;
    this.enemies = [];
    this.bullets = [];
    this.grenades = [];
    this.gems = [];
    this.floating = [];
    this.lasers = [];
    this.upgrades = [];
    this.ready = 0;
    this.spawnTimer = 0;
    this.spawnCount = 0;
    this.shake = 0;
    this.camera = { x: 0, y: 0 };
    this.step = 1 / 120;
    this.acc = 0;
    this.last = performance.now();
    this.player = new Player(this);
    this.stars = Array.from({ length: 80 }, () => ({ x: rand(-1600, 1600), y: rand(-1000, 1000), r: rand(.5, 2), a: rand(.15, .65) }));
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }
  resetWorld() {
    this.time = 0;
    this.kills = 0;
    this.level = 1;
    this.xp = 0;
    this.xpNext = 12;
    this.enemies.length = 0;
    this.bullets.length = 0;
    this.grenades.length = 0;
    this.gems.length = 0;
    this.floating.length = 0;
    this.lasers.length = 0;
    this.upgrades.length = 0;
    this.particles.items.length = 0;
    this.particles.shockwaves.length = 0;
    this.player = new Player(this);
    this.spawnTimer = .2;
    this.camera.x = 0;
    this.camera.y = 0;
    this.shake = 0;
    this.ready = 0;
  }
  start() {
    this.audio.boot();
    this.resetWorld();
    this.clearSave();
    this.state = 'playing';
  }
  togglePause() { if (this.state === 'playing') this.pause(); else if (this.state === 'paused') this.resume(); }
  pause() { if (this.state !== 'playing') return; this.audio.click(); this.state = 'paused'; }
  resume() { if (this.state !== 'paused') return; this.audio.click(); this.state = 'playing'; }
  get saveKey() { return 'cyberPurifierRunV1'; }
  hasSaveData() { try { return !!localStorage.getItem(this.saveKey); } catch (e) { return false; } }
  waveLabel() { return this.time < 60 ? 'WAVE 01' : this.time < 120 ? 'WAVE 02' : 'WAVE 03'; }
  savedRunSummary() {
    try {
      const s = JSON.parse(localStorage.getItem(this.saveKey) || '');
      return { wave: (s.time || 0) < 60 ? 1 : (s.time || 0) < 120 ? 2 : 3, time: s.time || 0 };
    } catch (e) { return null; }
  }
  serializeRun() {
    return {
      v: 1,
      time: this.time,
      kills: this.kills,
      level: this.level,
      xp: this.xp,
      xpNext: this.xpNext,
      hp: this.player.hp,
      maxHp: this.player.maxHp,
      speed: this.player.speed,
      magnet: this.player.magnet,
      crit: this.player.crit,
      weapons: this.player.weapons.map(w => ({ kind: w.kind, level: w.level }))
    };
  }
  saveRun() {
    if (!['playing', 'paused'].includes(this.state)) return;
    try {
      localStorage.setItem(this.saveKey, JSON.stringify(this.serializeRun()));
    } catch (e) {
      this.floating.push(new FloatingText(this.player.x, this.player.y - 30, 'SAVE FAILED', '#ff5d96', 16, true));
    }
    this.audio.click();
    this.resetWorld();
    this.state = 'menu';
  }
  loadRun() {
    let raw = null;
    try { raw = localStorage.getItem(this.saveKey); } catch (e) {}
    if (!raw) { this.start(); return; }
    let s;
    try { s = JSON.parse(raw); } catch (e) { this.start(); return; }
    this.audio.boot();
    this.resetWorld();
    this.time = s.time || 0;
    this.kills = s.kills || 0;
    this.level = s.level || 1;
    this.xp = s.xp || 0;
    this.xpNext = s.xpNext || 12;
    const p = this.player;
    p.maxHp = s.maxHp || 100;
    p.hp = Math.min(p.maxHp, s.hp != null ? s.hp : 100);
    p.speed = s.speed || 230;
    p.magnet = s.magnet || 115;
    p.crit = s.crit || .08;
    if (Array.isArray(s.weapons) && s.weapons.length) {
      p.weapons = s.weapons.map(w => Object.assign(new Weapon(w.kind, this), { level: w.level || 1 }));
    } else {
      p.weapons = [new Weapon('plasma', this)];
    }
    this.ready = 3;
    this.player.invulnerable = 3.4;
    this.particles.burst(this.player.x, this.player.y, ['#6bf5ff', '#fff'], 24, 200);
    this.state = 'playing';
    this.audio.levelUp();
  }
  abandonRun() {
    this.audio.click();
    this.clearSave();
    this.resetWorld();
    this.state = 'menu';
  }
  clearSave() { try { localStorage.removeItem(this.saveKey); } catch (e) {} }
  loop(now) {
    let frame = (now - this.last) / 1000;
    this.last = now;
    if (frame > .1) frame = .1;
    this.acc += frame;
    while (this.acc >= this.step) {
      this.update(this.step);
      this.acc -= this.step;
    }
    this.render();
    requestAnimationFrame(this.loop);
  }
  update(dt) {
    this.particles.update(dt);
    for (let i = this.floating.length - 1; i >= 0; i--) { this.floating[i].update(dt); if (this.floating[i].life <= 0) this.floating.splice(i, 1); }
    this.shake *= Math.pow(.06, dt);
    if (this.state !== 'playing') return;
    this.time += dt;
    this.player.update(dt);
    if (this.ready > 0) this.ready -= dt;
    this.spawnTimer -= dt;
    const maxEnemies = this.time < 60 ? 180 : this.time < 120 ? 220 : 245;
    if (this.spawnTimer <= 0 && this.enemies.length < maxEnemies && this.time < 180) {
      const count = this.time < 65 ? (Math.random() < .22 ? 2 : 1) : 1;
      for (let i = 0; i < count; i++) {

  bar(x, y, width, height, ratio, color, label) {
    ctx.save();
    ctx.font = '700 10px "Segoe UI", sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8fb0c0';
    ctx.fillText(label, x - 8, y + height / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(3, 9, 16, .8)';
    ctx.fillRect(x, y, width, height);
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 10;
    ctx.fillRect(x, y, width * clamp(ratio, 0, 1), height);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(152, 213, 233, .28)'; ctx.strokeRect(x, y, width, height);
    ctx.restore();
  }
  drawMenu() {
    const pulse = .5 + Math.sin(performance.now() * .002) * .5;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#6bf5ff';
    ctx.font = '800 11px "Segoe UI", sans-serif';
    ctx.fillText('CYPHER DIVISION  //  CLASSIFIED COMBAT SIMULATION', viewW / 2, viewH * .18);
    ctx.shadowColor = '#6bf5ff'; ctx.shadowBlur = 28;
    ctx.fillStyle = '#e4fbff';
    ctx.font = `900 ${Math.min(74, viewW * .075)}px "Segoe UI", sans-serif`;
    ctx.fillText('CYBER PURIFIER', viewW / 2, viewH * .3);
    ctx.shadowColor = '#ff4e9b'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#ff6ba9';
    ctx.font = `800 ${Math.min(25, viewW * .025)}px "Segoe UI", sans-serif`;
    ctx.fillText('PROTOCOL ZERO', viewW / 2, viewH * .39);
    ctx.shadowBlur = 0;
    ctx.font = '500 13px "Segoe UI", sans-serif';
    ctx.fillStyle = '#7f9bac';
    ctx.fillText('ENTER THE NEON STORM  /  ERASE THE EXTINCTION CORE', viewW / 2, viewH * .49);
    if (this.hasSaveData()) {
      const sum = this.savedRunSummary();
      const rb = this.resumeButton();
      const rh = pointer.x >= rb.x && pointer.x <= rb.x + rb.w && pointer.y >= rb.y && pointer.y <= rb.y + rb.h;
      const repr = sum ? `⚡ RESUME RUN (WAVE ${sum.wave} - ${fmtTime(sum.time)})` : '⚡ RESUME RUN';
      ctx.fillStyle = rh ? 'rgba(199,255,98,.22)' : 'rgba(199,255,98,.1)';
      ctx.strokeStyle = rh ? '#eaffb6' : '#c7ff62';
      ctx.lineWidth = rh ? 2.5 : 1.5;
      ctx.shadowColor = '#c7ff62'; ctx.shadowBlur = rh ? 30 : 14;
      ctx.fillRect(rb.x, rb.y, rb.w, rb.h);
      ctx.strokeRect(rb.x, rb.y, rb.w, rb.h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f1ffe0';
      ctx.font = '800 14px "Segoe UI", sans-serif';
      ctx.fillText(repr, viewW / 2, rb.y + rb.h / 2 + 1);
    }
    const button = this.menuButton();
    const hover = pointer.x >= button.x && pointer.x <= button.x + button.w && pointer.y >= button.y && pointer.y <= button.y + button.h;
    ctx.fillStyle = hover ? 'rgba(107, 245, 255, .21)' : 'rgba(107, 245, 255, .1)';
    ctx.strokeStyle = hover ? '#c6fcff' : '#6bf5ff';
    ctx.lineWidth = hover ? 2.5 : 1.5;
    ctx.shadowColor = '#6bf5ff'; ctx.shadowBlur = hover ? 28 : 15;
    ctx.fillRect(button.x, button.y, button.w, button.h);
    ctx.strokeRect(button.x, button.y, button.w, button.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#e8fdff';
    ctx.font = '800 14px "Segoe UI", sans-serif';
    ctx.fillText('INITIALIZE RUN', viewW / 2, button.y + 27);
    ctx.font = '600 10px "Segoe UI", sans-serif';
    ctx.fillStyle = `rgba(199, 255, 98, ${.52 + pulse * .35})`;
    ctx.fillText('WASD / ARROWS TO MOVE   ·   SPACE TO DASH', viewW / 2, viewH * .84);
    ctx.restore();
  }
  drawUpgrade() {
    ctx.save();
    ctx.fillStyle = 'rgba(2, 5, 12, .78)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#c7ff62';
    ctx.shadowColor = '#c7ff62'; ctx.shadowBlur = 20;
    ctx.font = '900 30px "Segoe UI", sans-serif';
    ctx.fillText('SYSTEM EVOLUTION', viewW / 2, viewH * .16);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#7694a4';
    ctx.font = '600 12px "Segoe UI", sans-serif';
    ctx.fillText(`LEVEL ${this.level}  //  SELECT ONE AUGMENTATION`, viewW / 2, viewH * .22);
    const rects = this.cardRects();
    rects.forEach((rect, index) => {
      const card = this.upgrades[index];
      if (!card) return;
      const hover = pointer.x >= rect.x && pointer.x <= rect.x + rect.w && pointer.y >= rect.y && pointer.y <= rect.y + rect.h;
      const lift = hover ? -8 : 0;
      ctx.save();
      ctx.translate(0, lift);
      ctx.fillStyle = hover ? 'rgba(16, 37, 50, .98)' : 'rgba(8, 18, 30, .96)';
      ctx.strokeStyle = hover ? card.accent : rgba(card.accent, .5);
      ctx.lineWidth = hover ? 2.5 : 1;
      ctx.shadowColor = card.accent; ctx.shadowBlur = hover ? 28 : 10;
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = rgba(card.accent, .12);
      ctx.fillRect(rect.x, rect.y, rect.w, 7);
      ctx.textAlign = 'left';
      ctx.fillStyle = card.accent;
      ctx.font = '900 31px "Segoe UI", sans-serif';
      ctx.fillText(card.icon, rect.x + 24, rect.y + 52);
      ctx.textAlign = 'right';
      ctx.font = '800 12px "Segoe UI", sans-serif';
      ctx.fillStyle = '#7895a4';
      ctx.fillText(`0${index + 1}`, rect.x + rect.w - 20, rect.y + 31);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ebfcff';
      ctx.font = '800 16px "Segoe UI", sans-serif';
      const titleLines = this.wrap(card.title, rect.w - 44, 16);
      titleLines.forEach((line, lineIndex) => ctx.fillText(line, rect.x + 22, rect.y + 103 + lineIndex * 23));
      ctx.fillStyle = '#82a0ae';
      ctx.font = '500 12px "Segoe UI", sans-serif';
      const descLines = this.wrap(card.description, rect.w - 44, 12);
      const descY = rect.y + 166;
      descLines.forEach((line, lineIndex) => ctx.fillText(line, rect.x + 22, descY + lineIndex * 21));
      ctx.fillStyle = hover ? card.accent : '#607987';
      ctx.font = '700 10px "Segoe UI", sans-serif';
      ctx.fillText('CLICK OR PRESS', rect.x + 22, rect.y + rect.h - 36);
      ctx.fillStyle = '#d7faff';
      ctx.font = '900 16px "Segoe UI", sans-serif';
      ctx.fillText(String(index + 1), rect.x + 22, rect.y + rect.h - 17);
      ctx.restore();
    });
    ctx.restore();
  }
  drawResult() {
    ctx.save();
    ctx.fillStyle = 'rgba(2, 5, 12, .8)'; ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const victory = this.resultVictory;
    const color = victory ? '#c7ff62' : '#ff5d96';
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 28;
    ctx.font = `900 ${Math.min(54, viewW * .06)}px "Segoe UI", sans-serif`;
    ctx.fillText(victory ? 'CORE PURIFIED' : 'SIGNAL LOST', viewW / 2, viewH * .31);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#91aab7'; ctx.font = '600 12px "Segoe UI", sans-serif';
    ctx.fillText(victory ? 'THE EXTINCTION PROTOCOL HAS BEEN NEUTRALIZED' : 'THE PURIFIER WAS OVERRIDDEN BY HOSTILE SIGNAL', viewW / 2, viewH * .41);
    ctx.fillStyle = '#e6fbff'; ctx.font = '800 18px "Segoe UI", sans-serif';
    ctx.fillText(`${String(this.kills).padStart(4, '0')} KILLS     ${fmtTime(this.time)} SURVIVED     LV ${this.level}`, viewW / 2, viewH * .52);
    const button = this.resultButton();
    const hover = pointer.x >= button.x && pointer.x <= button.x + button.w && pointer.y >= button.y && pointer.y <= button.y + button.h;
    ctx.fillStyle = hover ? rgba(color, .25) : rgba(color, .1);
    ctx.strokeStyle = color; ctx.lineWidth = hover ? 2.5 : 1.5; ctx.shadowColor = color; ctx.shadowBlur = hover ? 28 : 14;
    ctx.fillRect(button.x, button.y, button.w, button.h); ctx.strokeRect(button.x, button.y, button.w, button.h);
    ctx.shadowBlur = 0; ctx.fillStyle = '#efffff'; ctx.font = '800 14px "Segoe UI", sans-serif'; ctx.fillText('REINITIALIZE RUN', viewW / 2, button.y + 26);
    ctx.restore();
  }
  wrap(text, width, fontSize) {
    ctx.font = `${fontSize}px "Segoe UI", sans-serif`;
    const lines = [];
    let line = '';
    for (const char of text) {
      const candidate = line + char;
      if (ctx.measureText(candidate).width > width && line) { lines.push(line); line = char; } else line = candidate;
    }
    if (line) lines.push(line);
    return lines;
  }
}

const engine = new GameEngine();
document.addEventListener('visibilitychange', () => {
  if (document.hidden && engine.state === 'playing') engine.pause();
});
</script>
